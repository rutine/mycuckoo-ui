<!DOCTYPE html>
<html>
<head>
  <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
  <title>我已办理</title>
  <link type='image/x-icon' href='../../static/images/favicon.ico' rel='shortcut icon' />
  <link type='text/css' href='../../static/layui/2.13.5/css/layui.css' rel='stylesheet' />
  <link type='text/css' href='../../static/css/mycuckoo.css' rel='stylesheet' />
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
    }

    .mycuckoo-main {
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div class='mycuckoo-main'>
  <div class='layui-row'>
    <form class='layui-col-md12 layui-form mycuckoo-search'>
      <div class='layui-inline'>
        <div class='layui-input-inline'>
          <input class='layui-input' name='keyword' placeholder='关键字'>
        </div>
        <div class='layui-input-inline'>
          <button class='layui-btn' lay-filter='search' lay-submit>
            <i class='layui-icon'>&#xe615;</i>
          </button>
        </div>
      </div>
    </form>
  </div>

  <table id='ID_table' class='layui-hide' lay-filter='table'></table>
</div>
</body>
<script type='text/javascript' src='../../static/layui/2.13.5/layui.js' charset='UTF-8'></script>
<script type='text/javascript' src='../../static/mycuckoo.bundle.js' charset='UTF-8'></script>
<script type='text/javascript'>
  layui.use(['jquery', 'layer', 'form', 'dropdown', 'table'], function() {
    const $ = layui.jquery,
      layer = layui.layer,
      form = layui.form,
      dropdown = layui.dropdown,
      table = layui.table;

    const queryObj = MyCuckoo.getQueryObject(location.search);
    const resources = MyCuckoo.getResource(queryObj.reskey);
    const resourceMap = MyCuckoo.getDictMap(resources);
    const resourceObj = MyCuckoo.getMainResource(resources)

    function readVariable(data, key) {
      let variables = data && data.variables;
      if (!variables) {
        return data && data[key] ? data[key] : '';
      }
      if (Array.isArray(variables)) {
        let matched = variables.find(item => item && item.name === key);
        return matched ? matched.value : '';
      }

      return variables[key] === undefined || variables[key] === null ? '' : variables[key];
    }

    function readAssignee(data) {
      let assignee = data && data.assignee;
      if (!assignee) {
        return '';
      }
      let index = assignee.indexOf(':');
      if (index > 0) {
        return assignee.slice(index + 1);
      }
      let variables = data && data.variables;
      if (variables && variables.users && variables.users[assignee]) {
        return variables.users[assignee];
      }
      return assignee;
    }

    function readComment(data) {
      let comment = data && data.comment;
      if (!comment || !comment.comment) {
        return '';
      }
      let typeText = {1: '同意', 2: '驳回', 3: '退回'}[comment.type];
      return (typeText ? typeText + '：' : '') + comment.comment;
    }

    table.render({
      id: 'table',
      elem: '#ID_table',
      url: MyCuckoo.api.getUrl(resourceObj),
      method: resourceObj.method,
      cellMinWidth: 100,
      height: MyCuckoo.tableHeight,
      resources: resources,
      cols: [[
        {type: 'numbers'},
        {field: 'taskName', title: '任务名称', minWidth: 200,
          templet: function(d) {
            return (d.taskName || '') + (d.taskKey ? '(' + d.taskKey + ')' : '');
          }
        },
        {field: 'assignee', title: '办理人', minWidth: 120,
          templet: function(d) {
            return readAssignee(d);
          }
        },
        {field: 'definitionName', title: '流程名称', minWidth: 200,
          templet: function(d) {
            return (d.definitionName || '') + (d.definitionVersion ? '(' + d.definitionVersion + ')' : '');
          }
        },
        // {field: 'instanceId', title: '流程实例ID', minWidth: 180},
        {field: 'initiatorName', title: '发起人', minWidth: 120,
          templet: function(d) {
            return readVariable(d, 'initiatorName');
          }
        },
        {field: 'formType', title: '表单类型', minWidth: 120,
          templet: function(d) {
            return readVariable(d, 'formType');
          }
        },
        // {field: 'formId', title: '表单ID', minWidth: 120,
        //   templet: function(d) {
        //     return readVariable(d, 'formId');
        //   }
        // },
        {field: 'createTime', title: '创建时间', minWidth: 170},
        {field: 'endTime', title: '完成时间', minWidth: 170},
        {field: 'duration', title: '耗时', width: 110},
        {field: 'comment', title: '审批意见', minWidth: 200,
          templet: function(d) {
            let comment = d && d.comment;
            if (!comment || !comment.comment) {
              return '';
            }
            let cls = comment.type === '2' ? 'layui-bg-orange' : (comment.type === '3' ? 'layui-bg-gray' : 'layui-bg-blue');
            return '<span class=\'layui-badge ' + cls + '\'>' + readComment(d) + '</span>';
          }
        },
        {field: 'deleteReason', title: '状态', width: 90,
          templet: function(d) {
            return d.deleteReason
              ? '<span class=\'layui-badge layui-bg-orange\'>已驳回</span>'
              : '<span class=\'layui-badge layui-bg-green\'>已完成</span>';
          }
        },
        {fixed: 'right', title: '操作', align: 'center', width: 120, toolbar: MyCuckoo.getActions(resources, 'col'), resources: resources}
      ]],
      page: true,
      request: {
        pageName: 'pageNo',
        limitName: 'pageSize'
      },
      parseData: function(res) {
        return {
          code: res.code,
          msg: res.msg,
          count: res.data.totalElements,
          data: res.data.content
        }
      },
      done: function() {
        new IndexMgr();
      }
    });

    let indexMgrInst = null;
    const IndexMgr = function () {
      if (indexMgrInst) {
        return;
      }
      const that = indexMgrInst = this;

      form.on('submit(search)', function (data) {
        table.reload('table', {
          page: {pageNo: 1},
          where: data.field
        });

        return false;
      });

      table.on('tool(table)', function (obj) {
        obj.elem = this;
        that.on(obj);
      });

      table.on('toolbar(table)', function (obj) {
        if (obj.event.indexOf('LAYTABLE_') == 0) {
          return;
        }

        let data = table.checkStatus(obj.config.id).data;
        if (data.length != 1) {
          MyCuckoo.alert({title: '提示', msg: '请选择一条记录'});
          return;
        }

        obj.data = data[0];
        that.on(obj);
      });
    }
    IndexMgr.prototype = {
      constructor: IndexMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        if (!this[event]) {
          MyCuckoo.alert({title : '警示', msg : '此操作无效, 如有疑问, 请联系管理员!' });
          return;
        }

        this[event](obj);
      },
      reload: function() {
        table.reload('table', { page: { pageNo: 1 } });
      },
      view: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('flowInstanceMgrForm.html?reskey={reskey}&action={action}&instanceId={id}&deployId={deployId}',
                { ...queryObj, 'action': obj.event, 'id': data.instanceId, 'deployId': data.deployId})

        MyCuckoo.dialog('任务详情', url);
      },
      more: function (obj) {
        let that = this;
        let btns = MyCuckoo.getActions(resources, 'more');
        dropdown.render({
          elem: obj.elem,
          show: true,
          data: btns,
          customName: {
            title: 'name'
          },
          click: function(menudata) {
            obj.event = menudata.code;
            that.on(obj);
          }
        });
      }
    }
  });
</script>
</html>
