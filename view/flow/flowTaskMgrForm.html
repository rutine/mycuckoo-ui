<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任务审批</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../static/bpmn/18.0.0/css/diagram-js.css" />
  <link rel="stylesheet" href="../../static/bpmn/18.0.0/css/bpmn-js.css" />
  <link rel="stylesheet" href="../../static/bpmn/18.0.0/css/bpmn.css" />
  <style>
    html, body, .mycuckoo-main { height: 100%; margin: 0; overflow: hidden; }
    .flow-task { height: 100%; background: #f8f8f8; }
    .task-header { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; box-sizing: border-box; background: #fff; border-bottom: 1px solid #eee; }
    .task-title { margin-right: 8px; font-size: 16px; font-weight: 600; color: #333; }
    .task-actions { margin-left: auto; white-space: nowrap; }
    .task-actions .layui-btn { margin-left: 6px; }
    .task-content { height: calc(100% - 56px); background: #fff;}

    .task-tabs { margin: 0; height: 100%; }
    .task-tabs .layui-tabs-header { padding-left: 16px; }
    .task-tabs .layui-tabs-body { height: calc(100% - 41px); padding: 0; }
    .task-tabs .layui-tabs-item { height: 100%; overflow: auto; }

    .diagram-panel { position: relative; height: 100%; min-height: 360px; }
    .diagram-panel-bar .layui-badge-grp { position: absolute; left:18px; bottom: 18px; z-index: 2; }
    .diagram-panel-bar .layui-btn-group { position: absolute; right:18px; bottom: 18px; z-index: 2; }

    .canvas { height: 100%; background: #f8f8f8; }
    .canvas .bjs-powered-by { display: none; }
    .djs-element.highlight .djs-visual > :nth-child(1) { fill: #d9f7be !important; stroke: #2bc418 !important; }
    .djs-connection.highlight .djs-visual > path { stroke: #2bc418 !important; }
    .djs-element.highlight-todo .djs-visual > :nth-child(1) { fill: #fff1b8 !important; stroke: #ffb800 !important; }
    .djs-connection.highlight-todo .djs-visual > path { stroke: #ffb800 !important; }
  </style>
</head>
<body>
<div class="mycuckoo-main">
  <main class="flow-task">
    <header class="task-header">
      <span class="task-title"><i class="layui-icon layui-icon-form"></i> 待办任务</span>
      <span id="ID_start_user" class="layui-badge-rim"></span>
      <span id="ID_task_name" class="layui-badge-rim"></span>

      <div class="task-actions">
        <button type="button" class="layui-btn layui-btn-sm" data-event="approve" lay-submit>审批</button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" data-event="close" lay-submit>关闭</button>
      </div>
    </header>

    <section class="task-content">
      <div id="ID_task_tabs" class="layui-tabs task-tabs">
        <ul class="layui-tabs-header">
<!--          <li class="layui-this">表单信息</li>-->
          <li class="layui-this">流转记录</li>
          <li>流程图</li>
        </ul>
        <div class="layui-tabs-body">
          <!--
          <div class="layui-tabs-item layui-show">
            <form class="layui-form" lay-filter="taskForm">
              <div id="ID_task_form" class="layui-container">
                <div class="layui-form-item">
                  <label class="layui-form-label">申请编号</label>
                  <div class="layui-input-block"><input name="申请编号" type="text" class="layui-input" readonly></div>
                </div>
                <div class="layui-form-item">
                  <label class="layui-form-label">申请事项</label>
                  <div class="layui-input-block"><input name="申请事项" type="text" class="layui-input" readonly></div>
                </div>
                <div class="layui-form-item">
                  <label class="layui-form-label">申请金额</label>
                  <div class="layui-input-block"><input name="申请金额" type="text" class="layui-input" readonly></div>
                </div>
                <div class="layui-form-item">
                  <label class="layui-form-label">申请日期</label>
                  <div class="layui-input-block"><input name="申请日期" type="text" class="layui-input" readonly></div>
                </div>
                <div class="layui-form-item">
                  <label class="layui-form-label">申请说明</label>
                  <div class="layui-input-block"><textarea name="申请说明" class="layui-textarea" readonly></textarea></div>
                </div>
            </div>
            </form>
          </div>
          -->
          <div class="layui-tabs-item layui-show">
            <div id="ID_task_record" class="layui-container"></div>
          </div>
          <div class="layui-tabs-item">
            <div class="diagram-panel">
              <div id="ID_flow_canvas" class="canvas"></div>

              <div class="diagram-panel-bar">
                <div class="layui-badge-grp">
                  <span class="layui-badge layui-bg-green">已办理</span>
                  <span class="layui-badge layui-bg-orange">处理中</span>
                  <span class="layui-badge layui-bg-gray layui-border-cyan">未进行</span>
                </div>

                <div class="layui-btn-group">
                  <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" data-event="fitViewport" title="适中" aria-label="适中">
                    <i class="layui-icon layui-icon-screen-full"></i>
                  </button>
                  <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" data-event="zoomIn" title="放大" aria-label="放大">
                    <i class="layui-icon layui-icon-addition"></i>
                  </button>
                  <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" data-event="zoomOut" title="缩小" aria-label="缩小">
                    <i class="layui-icon layui-icon-subtraction"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="ID_task_approval">
  <form class="layui-form layui-padding-1" lay-filter="taskApproval">
    <div class="layui-form-item">
      <label class="layui-form-label">处理意见</label>
      <div class="layui-input-block">
        <textarea class="layui-textarea" name="comment" lay-verify="required" placeholder="请输入处理意见" required></textarea>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label"></label>
      <div class="layui-input-block">
        <input type="radio" name="type" value="NORMAL" title="通过" checked>
        <input type="radio" name="type" value="REJECT" title="驳回">
        <input type="radio" name="type" value="RETURN" title="退回">
      </div>
    </div>
    <div class="layui-form-item" style="margin-bottom:0;text-align:center">
      <button type="button" class="layui-btn layui-btn-sm" data-event="complete" lay-submit>提交</button>
      <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" data-layer-close>取消</button>
    </div>
  </form>
</div>

<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/bpmn/modeler-plugins.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'tabs', 'form', 'layer'], function() {
    const $ = layui.jquery;
    const form = layui.form;
    const layer = layui.layer;
    const tabs = layui.tabs;
    const queryObj = MyCuckoo.getQueryObject(location.search);
    const resources = MyCuckoo.getResource(queryObj.reskey);
    const resourceMap = MyCuckoo.getDictMap(resources);
    const resourceObj = resourceMap[queryObj.action] || MyCuckoo.getMainResource(resources);
    const useMockData = false;
    const mockTaskData = {
      initiatorName: '张三',
      taskName: '部门审批',
      form: {申请编号: 'SQ20260729001', 申请事项: '采购办公设备', 申请金额: '12,800.00 元', 申请日期: '2026-07-29', 申请说明: '用于新员工工位配置。'},
      records: [
        {taskName: '提交申请', assigneeName: '张三', deptName: '行政部', startTime: '2026-07-29 09:30:00', endTime: '2026-07-29 09:35:20', duration: '5分20秒', comment: '提交申请'},
        {taskName: '部门审批', assigneeName: '李四', deptName: '采购部', startTime: '2026-07-29 09:35:20', candidate: '李四、王五'}
      ],
      xml: '<definitions xmlns="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" targetNamespace="http://bpmn.io/schema/bpmn"><process id="TaskFormDemo" name="审批流程" isExecutable="false"><startEvent id="StartEvent_1" name="开始"/><userTask id="UserTask_1" name="提交申请"/><userTask id="UserTask_2" name="部门审批"/><endEvent id="EndEvent_1" name="结束"/><sequenceFlow id="Flow_1" sourceRef="StartEvent_1" targetRef="UserTask_1"/><sequenceFlow id="Flow_2" sourceRef="UserTask_1" targetRef="UserTask_2"/><sequenceFlow id="Flow_3" sourceRef="UserTask_2" targetRef="EndEvent_1"/></process><bpmndi:BPMNDiagram id="Diagram_1"><bpmndi:BPMNPlane id="Plane_1" bpmnElement="TaskFormDemo"><bpmndi:BPMNShape id="StartEvent_1_di" bpmnElement="StartEvent_1"><dc:Bounds x="100" y="142" width="36" height="36"/></bpmndi:BPMNShape><bpmndi:BPMNShape id="UserTask_1_di" bpmnElement="UserTask_1"><dc:Bounds x="210" y="120" width="110" height="80"/></bpmndi:BPMNShape><bpmndi:BPMNShape id="UserTask_2_di" bpmnElement="UserTask_2"><dc:Bounds x="420" y="120" width="110" height="80"/></bpmndi:BPMNShape><bpmndi:BPMNShape id="EndEvent_1_di" bpmnElement="EndEvent_1"><dc:Bounds x="630" y="142" width="36" height="36"/></bpmndi:BPMNShape><bpmndi:BPMNEdge id="Flow_1_di" bpmnElement="Flow_1"><di:waypoint x="136" y="160"/><di:waypoint x="210" y="160"/></bpmndi:BPMNEdge><bpmndi:BPMNEdge id="Flow_2_di" bpmnElement="Flow_2"><di:waypoint x="320" y="160"/><di:waypoint x="420" y="160"/></bpmndi:BPMNEdge><bpmndi:BPMNEdge id="Flow_3_di" bpmnElement="Flow_3"><di:waypoint x="530" y="160"/><di:waypoint x="630" y="160"/></bpmndi:BPMNEdge></bpmndi:BPMNPlane></bpmndi:BPMNDiagram></definitions>',
      nodes: [{key: 'StartEvent_1', completed: true}, {key: 'UserTask_1', completed: true}, {key: 'UserTask_2', completed: false}]
    };

    const FlowTaskForm = function() {
      this.viewer = null;
      this.data = null;
      this.binds();
      this.init();
      this.load();
    };

    FlowTaskForm.prototype = {
      constructor: FlowTaskForm,
      binds: function() {
        const that = this;
        form.on('submit', function (data) {
          let event = $(this).data('event');
          that[event] && that[event]({event: event, data: data.field});
        });
      },
      init: function() {
        const that = this;
        tabs.render({
          id: 'taskTabs',
          elem: document.getElementById('ID_task_tabs')
        });
        tabs.on('afterChange(taskTabs)', function(data) {
          if (data.length > 1 && data.index === data.length - 1) {
            setTimeout(function() { that.loadDiagram(); }, 0);
          }
        });
      },
      load: function() {
        if (useMockData) {
          this.data = mockTaskData;
          this.renderTask();
          return;
        }

        const that = this;
        if (!resourceObj) {
          MyCuckoo.msg({msg: '未找到待办任务资源', icon: 2});
          return;
        }
        $.request(resourceMap[MyCuckoo.res.flowMgr.instanceView], queryObj).then(function(response) {
          that.data = response.data;
          that.renderTask();
        }).catch(function() {
          MyCuckoo.msg({msg: '待办任务加载失败', icon: 2});
        });
      },
      renderTask: function() {
        const data = this.data;
        $('#ID_start_user').text('发起人: ' + (data.initiatorName || '-'));
        $('#ID_task_name').text('任务节点: ' + (data.taskName || '-'));
        form.val('taskForm', data.form);
            const recordHtml = (data.records || []).map(function(item) {
              const assignee = item.assigneeName || item.candidate || '-';
              const department = item.deptName ? ' <span class="layui-badge-rim">' + item.deptName + '</span>' : '';
              const done = Boolean(item.endTime);
              return '<li class="layui-timeline-item">' +
                '<i class="layui-icon layui-timeline-axis ' + (done ? 'layui-bg-green' : 'layui-bg-orange') + '">' + (done ? '&#xe605;' : '&#xe63f;') + '</i>' +
                '<div class="layui-timeline-content layui-text">' +
                  '<h5 class="layui-timeline-title">' + item.taskName + '</h5>' +
                  '<div class="layui-panel layui-bg-gray">' +
                  '<div><b>办理人: </b>' + assignee + department + '</div>' +
                  '<div><b>接收时间: </b>' + (item.startTime || '-') + '</div>' +
                  (item.endTime ? '<div><b>处理时间: </b>' + item.endTime + '</div>' : '') +
                  (item.duration ? '<div><b>耗时: </b>' + item.duration + '</div>' : '') +
                  (item.comment ? '<div><b>处理意见: </b>' + item.comment.comment + '</div>' : '') +
                  '</div>' +
                '</div>' +
              '</li>';
            }).join('');
            $('#ID_task_record').html('<ul class="layui-timeline">' + recordHtml + '</ul>');

        form.render();
      },
      approve: function(obj) {
        const that = this;
        layer.open({
          type: 1,
          title: '流程审批',
          area: ['420px', '260px'],
          content: $('#ID_task_approval'),
          success: function(layero, index) {
            $(layero).on('click', '[data-layer-close]', function() { layer.close(index); });
            // $(layero).find('form').on('submit', function(event) {
            //   event.preventDefault();
            //
            // });
            // form.render();
          }
        });
      },
      complete: function (obj) {
        const that = this;
        $.request(resourceObj, {...obj.data, ...queryObj}).then(function(json) {
          MyCuckoo.msg({msg: (json && json.msg) || '任务完成成功'});
          layer.closeLast('page');
          that.load();
        });
      },
      close: function() {
        let index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
      },
      loadDiagram: async function() {
        const data = this.data;
        if (!data || !data.xml || this.viewer) return;
        this.viewer = new ModelerPlugins.myViewer({container: '#ID_flow_canvas', height: '100%'});
        try {
          await this.viewer.importXML(data.xml);
          this.viewer.get('canvas').resized();
          this.fitViewport();
          this.fillColor(data.nodes || []);
        } catch (error) {
          console.error(error);
          MyCuckoo.msg({msg: '流程图解析失败', icon: 2});
        }
      },
      fitViewport: function() { if (this.viewer) this.viewer.get('canvas').zoom('fit-viewport', 'auto'); },
      zoomIn: function() { this.zoomViewport(true); },
      zoomOut: function() { this.zoomViewport(false); },
      zoomViewport: function(zoomIn) {
        if (!this.viewer) return;
        const canvas = this.viewer.get('canvas');
        const zoom = canvas.zoom() + (zoomIn ? 0.1 : -0.1);
        if (zoom >= 0.2) canvas.zoom(zoom);
      },
      fillColor: function(nodes) {
        const canvas = this.viewer.get('canvas');
        const nodeMap = new Map(nodes.map(function(node) { return [node.key, node]; }));
        this.viewer.getDefinitions().rootElements[0].flowElements.forEach(function(element) {
          const node = nodeMap.get(element.id);
          if (node) canvas.addMarker(element.id, node.completed ? 'highlight' : 'highlight-todo');
          (element.outgoing || []).forEach(function(outgoing) {
            const target = nodeMap.get(outgoing.targetRef.id);
            if (target) canvas.addMarker(outgoing.id, target.completed ? 'highlight' : 'highlight-todo');
          });
        });
      }
    };

    new FlowTaskForm();
  });
</script>
</body>
</html>
