<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>审批流</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/dtree.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/font/dtreefont.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
    }

    .mycuckoo-main {
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div class="mycuckoo-main">
  <div class="layui-row">
    <form class="layui-col-md12 layui-form mycuckoo-search">
      <div class="layui-inline">
        <div class="layui-input-inline">
          <input class="layui-input" name="q[code]" placeholder="用户号">
        </div>
        <div class="layui-input-inline">
          <input class="layui-input" name="q[name]" placeholder="用户名">
        </div>
        <div class="layui-input-inline">
          <button class="layui-btn" lay-filter="search" lay-submit>
            <i class="layui-icon">&#xe615;</i>
          </button>
        </div>
      </div>
    </form>
  </div>

  <table id="ID_table" class="layui-hide" lay-filter="table"></table>
</div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'dropdown', 'table'], function() {
    const $ = layui.jquery,
      form = layui.form,
      dropdown = layui.dropdown,
      table = layui.table;

    //本地缓存数据
    const queryObj = MyCuckoo.getQueryObject(location.search);
    const operator = MyCuckoo.getResource(queryObj.reskey);
    const operatorMap = MyCuckoo.getDictMap(operator);
    const action = MyCuckoo.getMainResource(operator);

    table.render({
      id: 'table',
      elem: '#ID_table',
      url: MyCuckoo.api.getUrl(action),
      method: action.method,
      cellMinWidth: 100,
      height: MyCuckoo.tableHeight,
      toolbar: MyCuckoo.getActions(operator, 'table'),
      // operator: operator,
      cols: [[
        {type: 'numbers'},
        {type: 'radio'},
        {field: 'name', title: '名称'},
        {field: 'processInstanceId', title: '实例ID'},
        {field: 'key', title: '流程编码'},
        {field: 'businessKey', title: '业务类型'},
        {field: 'startUser', title: '发起人'},
        {field: 'deleteReason', title: '删除原因'},
        {field: 'status', title: '状态'},
        {field: 'startTime', title: '启动时间'},
        {field: 'endTime', title: '结束时间'},
        {fixed: "right", title: "操作", align: "center", width: 120, toolbar: MyCuckoo.getActions(operator, 'col'), operator: operator}
      ]],
      page: true,
      request: {
        pageName: 'pageNo',
        limitName: 'pageSize'
      },
      parseData: function(res) {
        return {
          code: res.code,
          msg: res.msg,
          count: res.data.totalElements,
          data: res.data.content
        }
      },
      done: function(res, curr, count) {
        new IndexMgr();
      }
    });

    let indexMgrInst = null;
    const IndexMgr = function () {
      if (indexMgrInst) { //实例已存在
        return;
      }
      const that = indexMgrInst = this;

      form.on('submit(search)', function (data) {
        //执行重载
        table.reload('table', {
          page: {pageNo: 1},
          where: data.field
        });

        return false;
      });

      //单元格工具事件
      table.on('tool(table)', function (obj) {
        obj.elem = this;
        that.on(obj);
      });

      table.on('toolbar(table)', function (obj) {
        if (obj.event.indexOf('LAYTABLE_') == 0) {
          return;
        }
        if (obj.event.endsWith('add')) {
          that.on(obj);
          return;
        }

        let data = table.checkStatus(obj.config.id).data;
        if (data.length != 1) {
          MyCuckoo.alert({title: '提示', msg: '请选择一条记录'});
          return;
        }

        obj.data = data[0];
        that.on(obj);
      });
    }

    IndexMgr.prototype = {
      constructor: IndexMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        if (!this[event]) {
          MyCuckoo.alert({title : '警示', msg : '此操作无效, 如有疑问, 请联系管理员!' });
          return;
        }

        this[event](obj);
      },
      reload: function() {
        table.reload('table', { page: { pageNo: 1 } });
      },
      //增加
      add: function(obj) {
        let url = MyCuckoo.resolve('userMgrForm.html?reskey={reskey}&action={action}',
            {...queryObj, 'action': obj.event})
        MyCuckoo.dialog('用户信息', url);
      },
      //修改
      modify: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('userMgrForm.html?reskey={reskey}&action={action}&id={id}',
            { ...queryObj, 'action': obj.event, 'id': data.userId})
        MyCuckoo.dialog('用户信息', url);
      },
      //查看
      view: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('userMgrForm.html?reskey={reskey}&action={action}&id={id}',
            {...queryObj, 'action': obj.event, 'id': data.userId})
        MyCuckoo.dialog('用户信息', url);
      },
      //删除
      delete: function(obj) {
        let data = obj.data;
        let that = this;
        MyCuckoo.confirm({title: '警告提示', msg: '您确认删除此记录吗?',
          okBtn: '是', cancelBtn: '否', ok: function() {
            $.request(operatorMap[obj.event], {id: data.userId}).then(json => {
              MyCuckoo.msg({ msg: json.msg });

              that.reload();
            });
          }});
      },
      more: function (obj) {
        let that = this;
        let btns = MyCuckoo.getActions(operator, 'more');
        dropdown.render({
          elem: obj.elem,
          show: true,
          data: btns,
          customName: {
            title: 'name'
          },
          click: function(menudata) {
            obj.event = menudata.code;
            that.on(obj);
          }
        });
      }
      //end
    }
  });
</script>
