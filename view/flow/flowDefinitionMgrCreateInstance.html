<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>创建流程实例</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <style>
    /* 表单撑满屏幕，flex 纵向布局 */
    form[name=editForm] {
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #fff;
    }

    /* 整体滚动区域 */
    .instance-scroll-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 15px 20px;
      box-sizing: border-box;
      background-color: #f2f2f2; /* 衬托卡片 */
    }

    /* 卡片间距 */
    .instance-card {
      margin-bottom: 15px;
    }

    /* 审批人行 */
    .var-row {
      border: 1px solid #e6e6e6;
      border-radius: 4px;
      padding: 8px 12px 10px;
      margin-bottom: 10px;
      background-color: #fff;
    }

    .var-row-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .var-required {
      color: #ff4d4f;
      margin-left: 4px;
    }

    .var-tags {
      min-height: 28px;
    }

    /* 审批人标签 */
    .var-tag {
      position: relative;
      display: inline-block;
      margin: 0 8px 6px 0;
      padding: 0 16px 0 10px;
      height: 24px;
      line-height: 24px;
      font-size: 12px;
    }

    .var-tag-del {
      position: absolute;
      top: -6px;
      right: -4px;
      width: 14px;
      height: 14px;
      line-height: 14px;
      text-align: center;
      font-size: 10px;
      color: #fff;
      background: #ff4d4f;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="mycuckoo-main">
  <form class="layui-form" name="editForm" lay-filter="editForm">

    <!-- 整体滚动区域 -->
    <div class="instance-scroll-wrap">

      <!-- 1. 表单区域：复用 layui-card -->
      <div class="layui-card instance-card">
        <div class="layui-card-header" style="font-weight: bold;">表单填写</div>
        <div class="layui-card-body">
          <div id="ID_form_container"></div>
        </div>
      </div>

      <!-- 2. 审批人区域：复用 layui-card -->
      <div class="layui-card instance-card">
        <div class="layui-card-header" style="font-weight: bold;">审批人配置</div>
        <div class="layui-card-body">
          <div id="ID_approval_rows"></div>
        </div>
      </div>

    </div>

    <!-- 3. 底部按钮：复用 layui-footer -->
    <div class="layui-footer toolbar" style="height: 50px; line-height: 50px; text-align: center; background-color: #fff; border-top: 1px solid #e6e6e6;">
    </div>

  </form>
</div>

<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo-form.js" charset="UTF-8"></script>
<script>
  layui.use(['jquery', 'layer', 'form'], function() {
    const $ = layui.jquery,
        layer = layui.layer,
        form = layui.form,
        queryObj = MyCuckoo.getQueryObject(location.search),
        resources = MyCuckoo.getResource(queryObj.reskey),
        resourceMap = MyCuckoo.getDictMap(resources),
        resourceObj = resourceMap[queryObj.action],
        $form = $('form[name=editForm]');

    let createMgrInst = null;
    const CreateMgr = function() {
      if (createMgrInst) {
        return;
      }
      const that = createMgrInst = this;

      that.definitionId = queryObj.definitionId;
      that.formType = queryObj.formType;
      that.formCode = queryObj.formCode;
      that.bizId = queryObj.bizId || '';

      that.userPicker = MyCuckoo.createUserPicker({
        layer: layer,
        width: 520,
        height: 420,
        url: '../uum/userPicker.html'
      });

      that.variables = {};
      that.rows = [];
      that.usersMap = {};

      // 初始化表单组件
      MyCuckoo.form.render({
        elem: '#ID_form_container',
        formFilter: 'editForm',
        formCode: that.formCode,
        bizId: that.bizId,
        mode: 'edit'
      });

      // 加载审批人
      that.loadVariables();

      //渲染操作按钮
      $form.find('.toolbar').html(MyCuckoo.getActions(resourceObj || {}, 'form'));

      // 绑定审批人操作事件
      $('#ID_approval_rows').on('click', '.pick-user', function() {
        let index = $(this).data('index');
        that.on({ event: 'pickUser', data: index });
      });

      $('#ID_approval_rows').on('click', '.var-tag-del', function() {
        that.on({ event: 'removeUser', elem: this });
      });

      // 操作按钮触发事件
      $form.find('a.layui-btn:not([lay-submit])').on('click', function() {
        let event = $(this).data('event');
        that.on({ event: event, elem: this });
      });

      //监听提交
      form.on('submit', function(data) {
        let event = $(this).data('event');
        that.on({event: event, data: data.field});

        return false;
      });
    }

    CreateMgr.prototype = {
      constructor: CreateMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        if (!this[event]) {
          MyCuckoo.alert({ title: '警示', msg: '此操作无效, 如有疑问, 请联系管理员!' });
          return;
        }

        this[event](obj);
      },
      // 加载流程默认变量（审批人）
      loadVariables: function() {
        let that = this;
        const variableAction = resourceMap[MyCuckoo.res.flowMgr.defVariable];

        if (!variableAction || !variableAction.canAccess()) {
          that.buildRows();
          return;
        }

        $.request(variableAction, { definitionId: that.definitionId }).then(json => {
          if (json && json.code === 0) {
            that.variables = json.data || {};
          }
          that.buildRows();
        }).catch(function() {
          that.buildRows();
        });
      },
      // 构建审批人行数据
      buildRows: function() {
        let that = this;
        that.usersMap = Object.assign({}, (that.variables && that.variables.users) || {});
        that.rows = [];

        Object.keys(that.variables || {}).forEach(function(key) {
          if (key === 'users') return;

          let value = that.variables[key];
          let ids = [];

          if (Array.isArray(value)) {
            ids = value.map(function(id) { return String(id); });
          } else if (value != null && value !== '') {
            ids = String(value).split(',').map(function(id) { return id.trim(); }).filter(Boolean);
          }

          if (!ids.length) return;

          let sortIndex = 999;
          const match = key.match(/_(\d+)$/);
          if (match) {
            sortIndex = parseInt(match[1], 10);
          }

          that.rows.push({
            key: key,
            sortIndex: sortIndex,
            ids: ids,
            names: ids.map(function(id) { return that.usersMap[id] || id; })
          });
        });

        that.rows.sort(function(a, b) {
          return a.sortIndex - b.sortIndex;
        });

        that.rendApprovalRows();
      },
      // 渲染审批人区域
      rendApprovalRows: function() {
        let that = this;
        let $wrap = $('#ID_approval_rows');

        if (!that.rows.length) {
          $wrap.html('<div style="text-align:center;color:#999;padding:20px 0;">该流程没有默认审批人配置</div>');
          return;
        }

        const CN_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
        let html = '';

        that.rows.forEach(function(row, index) {
          let n = index + 1;
          let levelName = n <= 10 ? CN_NUM[n - 1] + '级审批' : '第' + n + '级审批';

          html += '<div class="var-row">';
          html += '<div class="var-row-title">' + levelName +
              '<span class="var-required">*</span>' +
              '<button type="button" class="layui-btn layui-btn-xs pick-user" style="margin-left:8px;" data-index="' + index + '">选择审批人</button>' +
              '</div>';
          html += '<div class="var-tags" data-index="' + index + '">' + that.rendTags(row, index) + '</div>';
          html += '</div>';
        });

        $wrap.html(html);
      },
      // 渲染审批人标签
      rendTags: function(row, index) {
        if (!row.ids.length) {
          return '<span class="layui-badge layui-bg-gray">请选择审批人</span>';
        }

        let html = '';
        row.ids.forEach(function(id, i) {
          html += '<span class="layui-badge layui-bg-blue var-tag" data-index="' + index + '" data-id="' + id + '">' +
              row.names[i] +
              '<i class="layui-icon layui-icon-close var-tag-del"></i>' +
              '</span>';
        });
        return html;
      },
      // 选择审批人
      pickUser: function(obj) {
        let that = this;
        let idx = obj.data;
        let row = that.rows[idx];

        that.userPicker({ ids: row.ids.join(','), names: row.names.join(',') }).then(function(users) {
          row.ids = users.map(function(u) { return u.id; });
          row.names = users.map(function(u) { return u.name; });
          users.forEach(function(u) { that.usersMap[u.id] = u.name; });
          $('#ID_approval_rows .var-tags[data-index=' + idx + ']').html(that.rendTags(row, idx));
        }).catch(function() {});
      },
      // 删除审批人标签
      removeUser: function(obj) {
        let that = this;
        let $tag = $(obj.elem).closest('.var-tag');
        let idx = $tag.data('index');
        let id = String($tag.data('id'));
        let row = that.rows[idx];
        let pos = row.ids.indexOf(id);

        if (pos > -1) {
          row.ids.splice(pos, 1);
          row.names.splice(pos, 1);
          $('#ID_approval_rows .var-tags[data-index=' + idx + ']').html(that.rendTags(row, idx));
        }
      },
      // 提交
      create: function(obj) {
        let that = this;

        if (!MyCuckoo.form.isLoaded()) {
          MyCuckoo.msg({ msg: '表单加载中，请稍候', icon: 2 });
          return;
        }

        if (!MyCuckoo.form.validateForm()) {
          return;
        }

        if (that.rows.some(function(row) { return !row.ids.length; })) {
          MyCuckoo.msg({ msg: '每级审批必须至少选择一个用户', icon: 2 });
          return;
        }

        // const formData = MyCuckoo.form.collectFormData();

        const formVariables = {};
        that.rows.forEach(function(row) { formVariables[row.key] = row.ids; });
        if (Object.keys(that.usersMap).length) {
          formVariables.users = that.usersMap;
        }

        const params = {
          definitionId: that.definitionId,
          formType: that.formType,
          formId: that.formCode,
          // formData: formData,
          formVariables: formVariables
        };

        $.request(resourceObj, params).then(json => {
          if (json && json.code === 0) {
            MyCuckoo.msg({ msg: '创建流程成功, 正在保持表单数据...' });
            MyCuckoo.form.save({bizId: json.data.id}).then(result => {
              if (result && result.code === 0) {
                MyCuckoo.msg({ msg: '创建流程成功, 正在保持表单数据...' });
                MyCuckoo.form.save({bizId: json.data.id}).then(result => {
                  MyCuckoo.msg({ msg: '表单数据保存成功' });
                  setTimeout(function() {
                    that.close();
                  }, 1500);
                });
              } else {
                MyCuckoo.msg({ msg: (json && json.msg) || '保存表单数据失败', icon: 2 });
              }
            });
          } else {
            MyCuckoo.msg({ msg: (json && json.msg) || '创建流程失败', icon: 2 });
          }
        });
      },
      // 关闭当前iframe页
      close: function() {
        let index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
      }
    }

    new CreateMgr();
    //end
  });
</script>
</body>
</html>
