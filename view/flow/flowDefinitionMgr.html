<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>审批流</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/dtree.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/font/dtreefont.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
    }

    .mycuckoo-main {
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div class="mycuckoo-main">
  <div class="layui-row">
    <form class="layui-col-md12 layui-form mycuckoo-search">
      <div class="layui-inline">
        <div class="layui-input-inline">
          <input class="layui-input" name="q[code]" placeholder="用户号">
        </div>
        <div class="layui-input-inline">
          <input class="layui-input" name="q[name]" placeholder="用户名">
        </div>
        <div class="layui-input-inline">
          <button class="layui-btn" lay-filter="search" lay-submit>
            <i class="layui-icon">&#xe615;</i>
          </button>
        </div>
      </div>
    </form>
  </div>

  <table id="ID_table" class="layui-hide" lay-filter="table"></table>
</div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'layer', 'form', 'dropdown', 'table'], function() {
    const $ = layui.jquery,
      layer = layui.layer,
      form = layui.form,
      dropdown = layui.dropdown,
      table = layui.table;

    //本地缓存数据
    const queryObj = MyCuckoo.getQueryObject(location.search);
    const resources = MyCuckoo.getResource(queryObj.reskey);
    const resourceMap = MyCuckoo.getDictMap(resources);
    const resourceObj = MyCuckoo.getMainResource(resources);
    const userPicker = MyCuckoo.createUserPicker({
      layer: layer,
      width: 520,
      height: 420,
      url: '../uum/userPicker.html'
    });

    table.render({
      id: 'table',
      elem: '#ID_table',
      url: MyCuckoo.api.getUrl(resourceObj),
      method: resourceObj.method,
      cellMinWidth: 100,
      height: MyCuckoo.tableHeight,
      toolbar: MyCuckoo.getActions(resources, 'table'),
      resources: resources,
      cols: [[
        {type: 'numbers'},
        {type: 'radio'},
        {field: 'key', title: 'key'},
        {field: 'name', title: '名称'},
        {field: 'description', title: '描述'},
        {field: 'resourceName', title: '资源文件'},
        {field: 'diagramResourceName', title: '图片文件'},
        {field: 'version', title: '版本号'},
        {field: 'hasStartFormKey', title: '是否有表单'},
        {fixed: "right", title: "操作", align: "center", width: 120, toolbar: MyCuckoo.getActions(resources, 'col'), resources: resources}
      ]],
      page: true,
      request: {
        pageName: 'pageNo',
        limitName: 'pageSize'
      },
      parseData: function(res) {
        return {
          code: res.code,
          msg: res.msg,
          count: res.data.totalElements,
          data: res.data.content
        }
      },
      done: function(res, curr, count) {
        new IndexMgr();
      }
    });

    let indexMgrInst = null;
    const IndexMgr = function () {
      if (indexMgrInst) { //实例已存在
        return;
      }
      const that = indexMgrInst = this;

      form.on('submit(search)', function (data) {
        //执行重载
        table.reload('table', {
          page: {pageNo: 1},
          where: data.field
        });

        return false;
      });

      //单元格工具事件
      table.on('tool(table)', function (obj) {
        obj.elem = this;
        that.on(obj);
      });

      table.on('toolbar(table)', function (obj) {
        if (obj.event.indexOf('LAYTABLE_') == 0) {
          return;
        }
        if (obj.event.endsWith('add')) {
          that.on(obj);
          return;
        }

        let data = table.checkStatus(obj.config.id).data;
        if (data.length != 1) {
          MyCuckoo.alert({title: '提示', msg: '请选择一条记录'});
          return;
        }

        obj.data = data[0];
        that.on(obj);
      });
    }

    IndexMgr.prototype = {
      constructor: IndexMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        if (!this[event]) {
          MyCuckoo.alert({title : '警示', msg : '此操作无效, 如有疑问, 请联系管理员!' });
          return;
        }

        this[event](obj);
      },
      reload: function() {
        table.reload('table', { page: { pageNo: 1 } });
      },
      //增加
      add: function(obj) {
        MyCuckoo.dialog('流程设计', '../../modeler.html?reskey={reskey}&action={action}',
                {...queryObj, 'action': obj.event}
        );
      },
      //修改
      modify: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('../../modeler.html?reskey={reskey}&action={action}&key={key}&name={name}&description={description}', {
          ...queryObj, 'action': obj.event,
          key: data.key,
          name: data.name || '',
          description: data.description || ''
        });
        MyCuckoo.dialog('流程设计', url);
      },
      //查看
      view: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('../../modeler.html?reskey={reskey}&action={action}&key={key}&name={name}&description={description}', {
          ...queryObj, 'action': obj.event,
          key: data.key,
          name: data.name || '',
          description: data.description || ''
        });
        MyCuckoo.dialog('流程预览', url);
      },
      //删除
      delete: function(obj) {
        let data = obj.data;
        let that = this;
        MyCuckoo.confirm({title: '警告提示', msg: '您确认删除此记录吗?',
          okBtn: '是', cancelBtn: '否', ok: function() {
            $.request(resourceMap[obj.event], {id: data.userId}).then(json => {
              MyCuckoo.msg({ msg: json.msg });

              that.reload();
            });
          }});
      },
      //创建实例
      create: function(obj) {
        let data = obj.data;
        let that = this;
        const action = resourceMap[obj.event];
        const variableAction = resourceMap[MyCuckoo.res.flowMgr.defVariable];

        // 发起前先获取流程默认变量（默认审批人），用于展示与调整
        if (!variableAction.canAccess()) {
          that.createDirect(action, data);
          return;
        }

        $.request(variableAction, { definitionId: data.id }).then(function(json) {
          if (!json || json.code !== 0) {
            that.createDirect(action, data);
            return;
          }

          that.openInstanceDialog(action, data, json.data || {});
        }).catch(function() {
          // 变量接口异常时不阻断发起，回退到默认确认流程
          that.createDirect(action, data);
        });
      },
      //直接发起（变量接口不可用或流程无默认变量时回退）
      createDirect: function(action, data) {
        const that = this;
        MyCuckoo.confirm({msg : '您确认创建流程实例？', ok : function() {
          that.doCreate(action, data, null);
        }});
      },
      //提交创建实例
      doCreate: function(action, data, formVariables) {
        const that = this;
        const params = { definitionId: data.id, formType: 'common-audit' };
        if (formVariables) {
          params.formVariables = formVariables;
        }

        $.request(action, params).then(function(json) {
          if (json && json.code === 0) {
            MyCuckoo.msg({ msg: '创建流程成功' });
            that.reload();
          } else {
            MyCuckoo.msg({ msg: (json && json.msg) || '创建流程失败', icon: 2 });
          }
        });
      },
      //创建实例前调整流程变量
      openInstanceDialog: function(action, data, variables) {
        const that = this;
        const usersMap = Object.assign({}, (variables && variables.users) || {});
        const rows = [];

        Object.keys(variables || {}).forEach(function(key) {
          const value = variables[key];
          if (key === 'users' || !Array.isArray(value)) {
            return;
          }

          const ids = value.map(function(id) { return String(id); });
          rows.push({ key: key, ids: ids, names: ids.map(function(id) { return usersMap[id] || id; }) });
        });

        if (!rows.length) {
          that.createDirect(action, data);
          return;
        }

        const CN_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
        function levelName(index) {
          const n = index + 1;
          return n <= 10 ? CN_NUM[n - 1] + '级审批' : '第' + n + '级审批';
        }

        function renderTags(row, index) {
          if (!row.ids.length) {
            return '<span class="layui-badge layui-bg-gray var-empty">请选择审批人</span>';
          }

          let html = '';
          row.ids.forEach(function(id, i) {
            html += '<span class="layui-badge layui-bg-blue var-tag" data-index="' + index + '" data-id="' + id + '">' + row.names[i] + '<i class="layui-icon layui-icon-close var-tag-del"></i></span>';
          });
          return html;
        }

        function buildHtml() {
          let html = '<div class="var-dialog"><style>'
            + '.var-dialog{height:100%;box-sizing:border-box;overflow-y:auto;padding:14px 16px;}'
            + '.var-row-title{font-weight:600;margin-bottom:8px;}'
            + '.var-required{color:#ff4d4f;margin-left:4px;}'
            + '.var-tag{padding-right:16px;margin:0 8px 0 0;}'
            + '.var-tag-del{position:absolute;top:-6px;right:-4px;width:14px;height:14px;line-height:14px;text-align:center;font-size:10px;color:#fff;background:#ff4d4f;border-radius:50%;cursor:pointer;}'
            + '</style>';
          rows.forEach(function(row, index) {
            html += '<div class="layui-panel" style="padding:8px 12px 10px;margin-bottom:10px;">';
            html += '<div class="var-row-title">' + levelName(index) + '<span class="var-required">*</span><button type="button" class="layui-btn layui-btn-xs pick-user" style="margin-left:8px;" data-index="' + index + '">选择审批人</button></div>';
            html += '<div class="var-tags" data-index="' + index + '">' + renderTags(row, index) + '</div>';
            html += '</div>';
          });
          return html + '</div>';
        }

        layer.open({
          type: 1,
          title: '创建流程实例',
          area: ['480px', '100%'],
          offset: 'r',
          anim: 'slideLeft',
          shade: 0.4,
          fixed: true,
          resize: false,
          move: false,
          content: buildHtml(),
          btn: ['确定', '取消'],
          success: function(layero) {
            layero.find('.pick-user').on('click', function() {
              const idx = $(this).data('index');
              const row = rows[idx];

              userPicker({ ids: row.ids.join(','), names: row.names.join(',') }).then(function(users) {
                row.ids = users.map(function(u) { return u.id; });
                row.names = users.map(function(u) { return u.name; });
                users.forEach(function(u) { usersMap[u.id] = u.name; });
                layero.find('.var-tags[data-index=' + idx + ']').html(renderTags(row, idx));
              }).catch(function() {});
            });

            layero.on('click', '.var-tag-del', function() {
              const $tag = $(this).closest('.var-tag');
              const idx = $tag.data('index');
              const id = String($tag.data('id'));
              const row = rows[idx];
              const pos = row.ids.indexOf(id);

              if (pos > -1) {
                row.ids.splice(pos, 1);
                row.names.splice(pos, 1);
                layero.find('.var-tags[data-index=' + idx + ']').html(renderTags(row, idx));
              }
            });
          },
          yes: function(index, layero) {
            if (rows.some(function(row) { return !row.ids.length; })) {
              MyCuckoo.msg({ msg: '每级审批必须至少选择一个用户', icon: 2 });
              return;
            }

            layer.close(index);

            const formVariables = {};
            rows.forEach(function(row) { formVariables[row.key] = row.ids; });
            if (Object.keys(usersMap).length) {
              formVariables.users = usersMap;
            }

            that.doCreate(action, data, formVariables);
          }
        });
      },
      more: function (obj) {
        let that = this;
        let btns = MyCuckoo.getActions(resources, 'more');
        dropdown.render({
          elem: obj.elem,
          show: true,
          data: btns,
          customName: {
            title: 'name'
          },
          click: function(menudata) {
            obj.event = menudata.code;
            that.on(obj);
          }
        });
      }
      //end
    }
  });
</script>
