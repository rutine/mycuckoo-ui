<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>选择表单</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <style>
    .picker-selected {
      margin: 10px 0;
      padding: 10px 12px;
      border-radius: 6px;
      background: #f8f8f8;
      color: #666;
      line-height: 1.7;
      word-break: break-all;
    }
  </style>
</head>
<body>
<div class="mycuckoo-main">
  <div class="layui-row">
    <form class="layui-col-md12 layui-form mycuckoo-search" name="searchForm">
      <div class="layui-inline">
        <div class="layui-input-inline">
          <input class="layui-input" name="keyword" placeholder="搜索：表单名称" />
        </div>
        <div class="layui-input-inline">
          <button class="layui-btn" lay-filter="search" lay-submit>
            <i class="layui-icon">&#xe615;</i>
          </button>
        </div>
      </div>
    </form>
  </div>

  <div class="picker-selected">
    <div>已选表单（<span id="ID_selected_count">0</span>）</div>
    <div id="ID_selected_summary">未选择</div>
    <div id="ID_selected_cache" class="layui-hide"></div>
  </div>

  <table id="ID_table" class="layui-hide" lay-filter="table"></table>

  <form class="layui-form" name="pickerForm">
    <div class="layui-btn-container" style="margin-top: 10px; text-align: center;">
      <a href="javascript:" class="layui-btn layui-btn-sm" data-event="assign" lay-submit>
        <i class="layui-icon layui-icon-ok"></i>确定
      </a>
      <a href="javascript:" class="layui-btn layui-btn-sm layui-btn-primary" data-event="close">
        <i class="layui-icon layui-icon-close"></i>取消
      </a>
    </div>
  </form>
</div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'table'], function() {
    const $ = layui.jquery,
        form = layui.form,
        table = layui.table,
        queryObj = MyCuckoo.getQueryObject(location.search),
        selectedForms = Object.create(null),
        $form = $('form[name=pickerForm]');

    function splitValue(value) {
      return (value || '').split(',')
          .map(function(item) {
            return item.trim();
          })
          .filter(function(item) {
            return item;
          });
    }

    function getFormId(formData) {
      return formData && formData.id !== undefined && formData.id !== null ? String(formData.id) : '';
    }

    function getFormName(formData) {
      return formData && (formData.name || formData.code || formData.id);
    }

    function getSelectedForms() {
      return Object.keys(selectedForms).map(function(id) {
        return selectedForms[id];
      });
    }

    function initSelectedForms(idsValue, namesValue) {
      const ids = splitValue(idsValue),
          names = splitValue(namesValue);

      ids.forEach(function(id, index) {
        selectedForms[id] = {
          id: id,
          name: names[index] || id
        };
      });
    }

    function upsertSelectedForm(formData) {
      const id = getFormId(formData);

      if (id === '') {
        return;
      }

      selectedForms[id] = {
        id: id,
        name: getFormName(formData) || (selectedForms[id] && selectedForms[id].name) || id
      };
    }

    function removeSelectedForm(formData) {
      const id = getFormId(formData);

      if (id === '') {
        return;
      }

      delete selectedForms[id];
    }

    function updateSelectedSummary() {
      const forms = getSelectedForms(),
          names = forms.map(function(item) {
            return item.name || item.id;
          });

      $('#ID_selected_count').text(String(forms.length));
      $('#ID_selected_summary').text(names.length ? names.join(', ') : '未选择');
      $('#ID_selected_cache').attr('data-json', forms.length ? JSON.stringify(forms[0]) : '');
    }

    function closeDialog() {
      const index = parent.layer.getFrameIndex(window.name);
      parent.layer.close(index);
    }

    function FormMgr() {
      const that = this;

      initSelectedForms(queryObj.ids, queryObj.names);
      updateSelectedSummary();

      table.render({
        id: 'table',
        elem: '#ID_table',
        url: MyCuckoo.api.getUrl({path: '/cms/form/mgr'}),
        method: 'get',
        cellMinWidth: 100,
        height: 'full-200',
        cols: [[
          {type: 'numbers'},
          {type: 'radio'},
          {field: 'name', title: '表单名称', minWidth: 180},
          {field: 'bizType', title: '业务类型', minWidth: 160},
          {field: 'createTime', title: '创建时间', minWidth: 160}
        ]],
        page: true,
        request: {
          pageName: 'pageNo',
          limitName: 'pageSize'
        },
        where: {
          keyword: ''
        },
        parseData: function(res) {
          const pageData = res.data && Array.isArray(res.data.content) ? res.data.content : [];

          pageData.forEach(function(item) {
            if (selectedForms[getFormId(item)]) {
              item.LAY_CHECKED = true;
              upsertSelectedForm(item);
            }
          });

          return {
            code: res.code,
            msg: res.msg,
            count: res.data ? res.data.totalElements : 0,
            data: pageData
          };
        },
        done: function() {
          updateSelectedSummary();
        }
      });

      table.on('radio(table)', function(obj) {
        const id = getFormId(obj.data);
        const checked = Boolean(obj.checked);

        if (!checked) {
          return;
        }

        // 单选：先清空再写入当前选中项
        Object.keys(selectedForms).forEach(function(key) {
          if (key !== id) {
            delete selectedForms[key];
          }
        });
        upsertSelectedForm(obj.data);
        updateSelectedSummary();
      });

      form.on('submit(search)', function(data) {
        that.search(data.field);
        return false;
      });

      $form.find('a.layui-btn').on('click', function() {
        const event = $(this).data('event');

        that[event] && that[event]({ event: event, elem: this });
      });
    }

    FormMgr.prototype = {
      constructor: FormMgr,
      search: function(params = {}) {
        table.reload('table', {
          page: {curr: 1},
          where: {
            keyword: $.trim(params.keyword || '')
          }
        });
      },
      assign: function() {
        const forms = getSelectedForms();
        if (!forms.length) {
          MyCuckoo.alert({ title: '提示', msg: '请选择一个表单!' });
          return;
        }

        closeDialog();
      },
      close: function() {
        $('#ID_selected_cache').attr('data-json', '');

        closeDialog();
      }
    };

    new FormMgr();
  });
</script>
</html>
