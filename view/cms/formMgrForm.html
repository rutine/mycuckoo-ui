<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>表单</title>
  <link rel="stylesheet" href="../../static/layui/2.13.5/css/layui.css" />
  <link rel="stylesheet" href="../../static/css/mycuckoo.css" />
</head>
<body>
<form id="ID_form_container" class="layui-form"  lay-filter="editForm" ></form>
</body>
<script src="../../static/layui/2.13.5/layui.js"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo-form.js"></script>
<script>
  layui.use(['jquery', 'layer'], function() {
    MyCuckoo.form.render({
      elem: '#ID_form_container',
      formFilter: 'editForm',
      mode: 'view'
    });

    // // 保存
    // MyCuckoo.form.save().then(json => {
    //   console.log('保存成功', json);
    // });

  });
</script>
</body>
</html>
