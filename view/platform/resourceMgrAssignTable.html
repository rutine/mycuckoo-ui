<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>表头信息</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <style>
    form[name=editForm] {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .mycuckoo-form-header {
      flex-shrink: 0;
      padding: 10px 10px 0;
    }

    .mycuckoo-table-wrap {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 0 10px;
    }

    /* 底部按钮：水平居中 + 垂直居中 */
    .toolbar {
      flex-shrink: 0;
      height: 50px;
      padding: 0 10px;
      background: #fff;
      border-top: 1px solid #e6e6e6;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
<div class="mycuckoo-main">
  <form class="layui-form layui-form-pane" name="editForm" lay-filter="editForm">
    <input type="hidden" name="moduleId"/>

    <div class="mycuckoo-form-header">
      <div class="layui-form-item" style="margin-bottom: 0;">
        <div class="layui-inline">
          <label class="layui-form-label">所属菜单</label>
          <div class="layui-input-inline">
            <input type="text" name="moduleName" class="layui-input" readonly disabled/>
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">表头编码</label>
          <div class="layui-input-inline">
            <input type="text" name="tableCode" class="layui-input" maxlength="60" lay-verify="required|alphanumeric" />
          </div>
        </div>
      </div>
    </div>

    <div class="mycuckoo-table-wrap">
      <table id="ID_table" class="layui-hide" lay-filter="table"></table>
    </div>

    <div class="toolbar"></div>
  </form>
</div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'dropdown', 'table'], function() {
    const $ = layui.jquery,
            form = layui.form,
            dropdown = layui.dropdown,
            table = layui.table,
            queryObj = MyCuckoo.getQueryObject(location.search),
            resources = MyCuckoo.getResource(queryObj.reskey),
            resourceMap = MyCuckoo.getDictMap(resources),
            resourceObj = resourceMap[queryObj.action],
            $form = $('form[name=editForm]');

    const types = [
      {code: 'seq', name: '序号'},
      {code: 'id', name: '主键'},
      {code: 'number', name: '数字'},
      {code: 'text', name: '文本'},
      {code: 'date', name: '时间'},
      {code: 'bool', name: '布尔'},
      {code: 'dict', name: '字典'}
    ];
    const filterTypes = [
      {code: 'eq', name: '等于'},
      {code: 'like', name: '前缀匹配'},
      {code: 'text', name: '模糊'},
      {code: 'scope', name: '区间'},
      {code: 'multi', name: '多选'},
      {code: 'province_city', name: '两级地区'},
      {code: 'province_city_area', name: '三级地区'},
      {code: 'bool', name: '是否'}
    ];
    const typeMap = MyCuckoo.getDictMap(types);
    const filterTypeMap = MyCuckoo.getDictMap(filterTypes);

    const action = resourceMap[MyCuckoo.res.resourceMgr.selector];
    if (!action.canAccess()) {
      MyCuckoo.msg({ msg: '无权访问此资源' });
      return;
    }

    const tableInst = table.render({
      id: 'table',
      elem: '#ID_table',
      url: MyCuckoo.resolve(MyCuckoo.api.getUrl(action), queryObj),
      method: 'get',
      height: 'full-120',
      css: [
        '.layui-table-cell{height: 50px; line-height: 40px;}',
        '.layui-table-cell select{height: 36px; padding: 0 5px;}'
      ].join(''),
      toolbar: '<div class="layui-btn-container"><a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="addRow">新增行</a></div>',
      cols: [[
        {type: 'numbers'},
        {field: 'type', title: '类型', templet: function(d) {
            let uid = d.LAY_INDEX !== undefined ? d.LAY_INDEX : Math.random().toString(36).slice(2);
            let arr = [
              '<select name="type_' + uid + '" data-field="type" lay-filter="table-col-filter" lay-append-to="body">',
              '<option value="">请选择</option>'
            ]
            types.forEach(item => {
              let selected = (d.type === item['code'] ? 'selected' : '');
              arr.push('<option value="' + item['code'] + '" ' + selected + '>' + item['name'] + '</option>')
            });
            arr.push('</select>')
            return arr.join('');

            // let name = typeMap[d.type].name || d.type;
            // let arr = ['<a class="layui-btn layui-btn-primary table-col-dropdown-type">',
            //   '<span>' + name + '</span>',
            //   '<i class="layui-icon layui-icon-down layui-font-12"></i>',
            //   '</a>'
            // ];
            // return arr.join('');
          }},
        {field: 'field', title: '字段', edit: 'text'},
        {field: 'title', title: '标题', edit: 'text'},
        {field: 'filterType', title: '过滤类型', templet: function(d) {
            let name = filterTypeMap[d.filterType].name || d.filterType;
            let arr = ['<a class="layui-btn layui-btn-primary table-col-dropdown-filterType">',
              '<span>' + name + '</span>',
              '<i class="layui-icon layui-icon-down layui-font-12"></i>',
              '</a>'
            ];
            return arr.join('');
          }},
        {field: 'filter', title: '过滤', width: 30, templet: function(d) {
            return '<input type="checkbox" name="filter" value="' + d.filter + '" title="是|否" lay-skin="switch" lay-filter="table-col-filter"' + (d.filter ? 'checked' : '') + '>';
          }},
        {field: 'sort', title: '排序', width: 30, templet: function(d) {
            return '<input type="checkbox" name="sort" value="' + d.sort + '" title="是|否" lay-skin="switch" lay-filter="table-col-filter"' + (d.sort ? 'checked' : '') + '>';
          }},
        {field: 'blank', title: '可空', width: 30, templet: function(d) {
            return '<input type="checkbox" name="blank" value="' + d.blank + '" title="是|否" lay-skin="switch" lay-filter="table-col-filter"' + (d.blank ? 'checked' : '') + '>';
          }},
        {field: 'width', title: '宽度', edit: 'text'},
        {field: 'extra', title: '额外信息', edit: 'text'},
        {fixed: "right", title: "操作", width: 150, toolbar: (function() {
            return [
              '<div class="layui-btn-container">',
              '<a class="layui-btn layui-btn-xs" lay-event="moveupRow">',
              '<i class="layui-icon layui-icon-up"></i>',
              '</a>',
              '<a class="layui-btn layui-btn-xs layui-bg-red" lay-event="deleteRow">',
              '<i class="layui-icon layui-icon-delete"></i>',
              '</a>',
              '</div>'
            ].join('');
          })()}
      ]],
      page: false,
      done: function(res, curr, count) {
        let options = this;
        let commDropdown = function (config) {
          dropdown.render({
            elem: config.elem,
            data: config.data,
            customName: {id: 'code', title: 'name'},
            click: function(obj) {
              let data = tableInst.getRowData(options.id, this.elem);
              this.elem.find('span').html(obj.name);
              data[config.field] = obj.code;
            }
          });
        }

        form.on('select(table-col-filter)', function(obj) {
          let value = obj.value;
          let data = tableInst.getRowData(options.id, obj.elem);
          let field = obj.elem.getAttribute('data-field') || obj.elem.name;
          data[field] = value;
        });

        form.on('switch(table-col-filter)', function(obj) {
          let data = tableInst.getRowData(options.id, obj.elem);
          data[obj.elem.name] = obj.elem.checked;
        });

        // commDropdown({elem: '.table-col-dropdown-type', data: types, field: 'type'});
        commDropdown({elem: '.table-col-dropdown-filterType', data: filterTypes, field: 'filterType'})

        new FormMgr();
      }
    });

    tableInst.getRowData = function(tableId, elem) {
      let index = $(elem).closest('tr').data('index');
      return table.cache[tableId][index] || {};
    };

    tableInst.getCache = function() {
      return table.cache[this.config.id] || {};
    };

    form.verify({
      alphanumeric: function(value, elem){
        if (!/^(?![0-9_])[a-zA-Z0-9_]+(?<![_])$/.test(value)) {
          return '必须由字符数字和下划线组成, 首字符不能数字, 首尾字符不能下划线';
        }
      }
    });

    let formMgrInst = null;
    const FormMgr = function() {
      if (formMgrInst) {
        return;
      }
      const that = formMgrInst  = this;

      $form.find('.toolbar').html(MyCuckoo.getActions(resourceObj || {}, 'form'));

      if (queryObj.action) {
        let data = tableInst.getCache();
        let one = data.length > 0 ? data[0] : {};
        form.val('editForm', $.extend({}, queryObj, one));
      }

      table.on('edit(table)', function(obj) {
        let field = obj.field;
        let value = obj.value
        let oldValue = obj.oldValue
        let col = obj.getCol();
        if (field === 'title') {
          if (!/^[a-zA-Z0-9_\u4e00-\u9fa5\\s·]+$/.test(value)) {
            layer.tips('标题不能有特殊字符', this, {tips: 1});
            return obj.reedit();
          }
        } else if (field === 'width') {
          if (!/^[0-9]{1,3}$/.test(value)) {
            layer.tips('宽度必须又3位以内数字', this, {tips: 1});
            return obj.reedit();
          }
        } else if (!/^(?![0-9_])[a-zA-Z0-9_]+(?<![_])$/.test(value)) {
          layer.tips('必须由字符数字和下划线组成, 首字符不能数字, 首尾不能下划线', this, {tips: 1});
          return obj.reedit();
        }
        let maxLen = 30;
        if (field === 'extra') {
          maxLen = 100;
        }
        if (value.length > maxLen) {
          layer.tips('长度不能超过' + maxLen + '个字符', this, {tips: 1});
          return obj.reedit();
        }
      });

      table.on('tool(table)', function(obj) {
        obj.othis = this;
        that.on(obj);
      });

      table.on('toolbar(table)', function(obj) {
        that.on(obj);
      });

      $form.find('a.layui-btn:not([lay-submit])').on('click', function() {
        let event = $(this).data('event');
        event && that.on({event: event, data: this});
      });

      form.on('submit', function(data) {
        let fields = [
          {key: 'type', value: '类型'},
          {key: 'field', value: '字段'},
          {key: 'title', value: '标题'},
          {key: 'filterType', value: '过滤类型'}
        ]
        let tableData = table.cache['table'];
        for (let i in tableData) {
          for (let ii in fields) {
            if (tableData[i][fields[ii].key] === undefined || tableData[i][fields[ii].key] === '') {
              MyCuckoo.msg({ msg : '第' + (parseInt(i) + 1) + '行[' + fields[ii].value + ']不能为空!'});
              return false;
            }
          }
        }

        data.field['configs'] = tableData;
        let event = $(this).data('event');
        that.on({event: event, data: data.field});

        return false;
      });
    }

    FormMgr.prototype = {
      constructor: FormMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        this[event] && this[event](obj);
      },
      assign: function(obj) {
        $.request(resourceObj, obj.data).then(json => {
          MyCuckoo.msg({msg: json.msg});
          this.refresh();
        });
      },
      addRow: function(obj) {
        let data = table.cache[obj.config.id];
        data.push({
          type: 'text',
          field: '',
          title: '',
          filterType: 'eq',
          filter: false,
          sort: false,
          blank: false,
          extra: ''
        })
        table.renderData(obj.config.id);
        table.resize(obj.config.id);
      },
      deleteRow: function (obj) {
        let data = table.cache[obj.config.id];
        if (obj.data.tableId || obj.data.field) {
          MyCuckoo.confirm({msg : '您确认删除此记录吗?', ok : function() {
              let item = data.splice(obj.index, 1)
              table.renderData(obj.config.id);
            }});
        } else {
          let item = data.splice(obj.index, 1)
          table.renderData(obj.config.id);
        }
      },
      moveupRow: function (obj) {
        if (obj.index === 0) {
          return
        }

        let data = table.cache[obj.config.id];
        let item = data.splice(obj.index, 1);
        data.splice(obj.index - 1, 0, item[0]);
        table.renderData(obj.config.id);
      },
      refresh: function() {
        let that = this;
        setTimeout(function() {
          that.close();
        }, 1500);
      },
      close: function(ele) {
        let index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
      }
    }
    //end
  });
</script>
</body>
</html>
