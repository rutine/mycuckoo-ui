<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>系统平台</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
    }

    .mycuckoo-main {
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div class="mycuckoo-main">
  <div class="layui-row">
    <form class="layui-col-md12 layui-form mycuckoo-search">
      <div class="layui-inline">
        <div class="layui-input-inline">
          <input class="layui-input" name="name" placeholder="模块名称">
        </div>
        <div class="layui-input-inline">
          <button class="layui-btn" lay-filter="search" lay-submit>
            <i class="layui-icon">&#xe615;</i>
          </button>
        </div>
      </div>
    </form>
  </div>

  <table id="ID_table" class="layui-hide" lay-filter="table"></table>
</div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.api.js" charset="UTF-8"></script>
<script type="text/html" id="ID_tool">
  <div class="layui-clear-space">
    {{#
      layui.each(d.LAY_COL.resources, function(index, item) {
        if (d.level == 3 && (item.group & 4) === 4 && (item.code.endsWith('add') || item.code.endsWith('assign'))) {
    }}
    <a class="layui-btn layui-btn-xs {{ item.code.endsWith('add') ? 'layui-btn-warm' : 'layui-bg-purple'}}" lay-event="{{ item.code }}">
      <i class="layui-icon layui-icon-{{ item.iconCls }}"></i> {{ item.name }}
    </a>
    {{#
        } else if (d.level == 4 && (item.group & 4) === 4 && (item.code.endsWith('view') || item.code.endsWith('modify'))) {
    }}
    <a class="layui-btn layui-btn-xs {{ item.code.endsWith('view') ? 'layui-btn-primary' : 'layui-btn-info'}}" lay-event="{{ item.code }}">
      <i class="layui-icon layui-icon-{{ item.iconCls }}"></i> {{ item.name }}
    </a>
    {{#
        }
      });
    }}
  </div>
</script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'treeTable'], function() {
    const $ = layui.jquery,
      form = layui.form,
      table = layui.treeTable;

    //本地缓存数据
    const queryObj = MyCuckoo.getQueryObject(location.search);
    const resources = MyCuckoo.getResource(queryObj.reskey);
    const resourceMap = MyCuckoo.getDictMap(resources);
    const resourceObj = MyCuckoo.getMainResource(resources);

    const tableInst = table.render({
      id: 'table',
      elem: '#ID_table',
      url: MyCuckoo.api.getUrl(resourceObj),
      method: resourceObj.method,
      cellMinWidth: 100,
      height: MyCuckoo.tableHeight,
//      toolbar: MyCuckoo.getToolbar(resources, 'table'),
      resources: resources,
      tree: {
        customName: {
          isParent: 'isParent',
          name: 'text'
        },
        view: {
          expandAllDefault: true
        },
        data: {rootPid: 0}
      },
      cols: [[
        {field: 'text', title: '名称', width: 200},
        {field: 'code', title: '操作', width: 200, templet: function(d) { return d.code ? d.code : '' }},
        {field: 'method', title: '方法', templet: function(d) { return d.method ? d.method : '' }},
        {field: 'path', title: 'url', templet: function(d) { return d.method ? d.path : '' }},
        {field: 'order', title: '顺序', templet: function(d) { return d.method ? d.order : '' }},
        {field: 'status', title: '状态', templet: function(d) {
            return d.method ? (d.status == 'enable' ? '启用' : '停用') : ''
        }},
        {field: 'createTime', title: '创建日期', templet: function(d) { return d.method ? d.createTime : '' }},
        {fixed: "right", title: "操作", width: 190, align: "center", toolbar: '#ID_tool', resources: resources}
      ]],
      page: false,
      done: function(res, curr, count) {
        function expandTree(trees) {
          trees && trees.length > 0 && trees.map(tree => {
            if (!tree.spread) {
              table.expandNode('table', {index: tree.LAY_DATA_INDEX});
            } else {
              expandTree(tree.children);
            }
          })
        }
        expandTree(table.getData('table'));

        new IndexMgr();
      }
    });

    let indexMgrInst = null;
    const IndexMgr = function () {
      if (indexMgrInst) { //实例已存在
        return;
      }
      const that = indexMgrInst  = this;

      form.on('submit(search)', function(data) {
        //执行重载
        that.reload({where: data.field});

        return false;
      });

      //单元格工具事件
      table.on('tool(table)', function(obj) {
        let data = obj.data;
        if (typeof data.id == 'string') {
          data.id = data.id .replace('id-leaf-', '')
        }

        that.on(obj);
      });

      table.on('toolbar(table)', function (obj) {
        if (obj.event.indexOf('LAYTABLE_') == 0) {
          return;
        }
        if (obj.event == 'add') {
          that.on(obj);
          return;
        }

        let data = table.radioStatus(obj.config.id);
        if (!data.resourceId) {
          MyCuckoo.alert({title : '提示', msg : '请选择一条记录' });
          return;
        }

        obj.data = data;
        that.on(obj);
      });
    }

    IndexMgr.prototype = {
      constructor: IndexMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        if (!this[event]) {
          MyCuckoo.alert({title : '警示', msg : '此操作无效, 如有疑问, 请联系管理员!' });
          return;
        }

        this[event](obj);
      },
      reload: function(config) {
        table.reload('table', config || {});
      },
      //增加
      add: function(obj) {
        let url = MyCuckoo.resolve('resourceMgrForm.html?reskey={reskey}&action={action}&moduleId={id}',
            { ...queryObj, 'action': obj.event, 'id': obj.data.id})
        MyCuckoo.dialog('资源信息', url);
      },
      //分配
      assign: function(obj) {
        let url = MyCuckoo.resolve('resourceMgrAssignTable.html?reskey={reskey}&action={action}&moduleId={id}&moduleName={name}',
          { ...queryObj, 'action': obj.event, 'id': obj.data.id, 'name': obj.data.text})
        MyCuckoo.dialog('表头信息', url);
      },
      //修改
      modify: function(obj) {
        let data = obj.data;
        data.action = obj.event;
        data.opt = queryObj.id;
        let url = MyCuckoo.resolve('resourceMgrForm.html?reskey={reskey}&action={action}&id={id}&moduleId={parentId}', data)
        MyCuckoo.dialog('资源信息', url);
      },
      //查看
      view: function(obj) {
        let data = obj.data;
        data.action = obj.event;
        data.opt = queryObj.id;
        let url = MyCuckoo.resolve('resourceMgrForm.html?reskey={reskey}&action={action}&id={id}&moduleId={parentId}', data)
        MyCuckoo.sideDialog('资源信息', url);
      },
      //删除
      delete: function(obj) {
        let that = this;
        let data = obj.data;
        MyCuckoo.confirm({msg : '您确认删除此记录吗?', ok : function() {
          $.request(resourceMap[obj.event], {id: data.resourceId}).then(json => {
            MyCuckoo.msg({ msg: '资源删除成功' });

            that.reload(); // 刷新列表
          });
        }});
      },
      //启用
      enable: function(obj) {
        let data = obj.data;
        if(data.status == 'enable') {
          MyCuckoo.msg({ msg : '此菜单已经启用' });
          return;
        }
        if (data.level != 3) {
          MyCuckoo.msg({ msg : '请您选择资源!' });
          return;
        }

        let that = this;
        $.request(resourceMap[obj.event], {id: data.moduleId, disEnableFlag: 'enable'}).then(json => {
          MyCuckoo.msg({ msg: '菜单启用成功' });

          that.reload(); // 刷新列表
        });
      },
      //停用
      disable: function(obj) {
        if(obj.data.status == 'disable') {
          MyCuckoo.alert({ title : '提示', msg : '此资源已经停用' });
          return;
        }
        if (obj.data.level != 3) {
          MyCuckoo.alert({ msg : '请您选择资源!' });
          return;
        }

        let that = this;
        MyCuckoo.confirm({msg : '您确认停用此资源吗?如果停用,此资源下的操作将自动清除,并重登生效.', ok : function() {
          $.request(resourceMap[obj.event], {id: obj.data.moduleId, disEnableFlag: 'disable'}).then(json => {
            MyCuckoo.msg({ msg: '资源停用成功' });

            that.reload(); // 刷新列表
          });
        }});
      }
    }
    //end
  });
</script>
</html>
