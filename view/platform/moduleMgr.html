<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>系统平台</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
    }

    .mycuckoo-main {
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>

<div class="mycuckoo-main">
  <div class="layui-row">
    <form class="layui-col-md12 layui-form mycuckoo-search">
      <div class="layui-inline">
        <div class="layui-input-inline">
          <input class="layui-input" name="q[code]" placeholder="模块编码">
        </div>
        <div class="layui-input-inline">
          <input class="layui-input" name="q[name]" placeholder="模块名称">
        </div>
        <div class="layui-input-inline">
          <button class="layui-btn" lay-filter="search" lay-submit>
            <i class="layui-icon">&#xe615;</i>
          </button>
        </div>
      </div>
    </form>
  </div>

  <table id="ID_table" class="layui-hide" lay-filter="table"></table>
</div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/html" id="ID_toolbar">
  <!-- 弃用 -->
  <div class="layui-btn-group btn-toolbar">
    {{# layui.each(d.resources, function(index, item) {
      if ((item.group & 2) !== 2) return;
    }}
    <button class="layui-btn layui-btn-sm" lay-event="{{ item.code }}">
      <i class="layui-icon layui-icon-{{ item.iconCls }}"></i> {{ item.name }}
    </button>
    {{# }); }}
  </div>
</script>
<script type="text/html" id="ID_tool">
  <!-- 弃用 -->
  <div class="layui-clear-space">
    {{#
      let i = 0;
      let count = 0;
      layui.each(d.LAY_COL.resources, function(index, item) {
        if ((item.group & 4) === 4) {
          count++;
        }
      });

      layui.each(d.LAY_COL.resources, function(index, item) {
        if ((item.group & 4) !== 4) {
          return;
        } else if (i === 0) {
          i++;
    }}
    <a class="layui-btn layui-btn-xs" lay-event="{{ item.code }}">
      <i class="layui-icon layui-icon-{{ item.iconCls }}"></i> {{ item.name }}
    </a>
    {{#
        } else if (i === 1) {
          i++;
    }}
    <a class="layui-btn layui-btn-xs" lay-event="more">更多
      <i class="layui-icon layui-icon-down"></i>
    </a>
    {{#
        }
      });
    }}
  </div>
</script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'dropdown', 'treeTable'], function() {
    const $ = layui.jquery,
      form = layui.form,
      dropdown = layui.dropdown,
      table = layui.treeTable;

    //本地缓存数据
    const queryObj = MyCuckoo.getQueryObject(location.search);
    const resources = MyCuckoo.getResource(queryObj.reskey);
    const resourceMap = MyCuckoo.getDictMap(resources);
    const resourceObj = MyCuckoo.getMainResource(resources);

    MyCuckoo.api.postTable({code: 'table_code_menu'}).then(function (json) {
      let col = [
        {type: 'radio'},
      ]
      for (let i in json.data) {
        let obj = json.data[i];
        if (obj['type'] === 'id') {
          //主键不显示
          continue;
        } else if (obj['type'] === 'seq') {
          col.push({type: 'numbers', title: obj['title']});
        } else if (obj['type'] === 'dict') {
          if (!obj['dictMap']) {
            obj['dictMap'] = MyCuckoo.getDictMap(obj['dict']);
          }
          col.push({field: obj['field'], title: obj['title'], sort: obj['sort'], width: obj['width'], colConfig: obj, templet: function(d) {
              return this.colConfig['dictMap'][d[this.colConfig['field']]]['name'];
          }});
        } else {
          col.push({field: obj['field'], title: obj['title'], sort: obj['sort'], width: obj['width'], colConfig: obj});
        }
      }
      // col.push({fixed: "right", title: "操作", align: "center", width: 120, toolbar: '#ID_tool', resources: operesourcesrator});
      col.push({fixed: "right", title: "操作", align: "center", width: 120, toolbar: MyCuckoo.getActions(resources, 'col'), resources: resources});

      const tableInst = table.render({
        id: 'table',
        elem: '#ID_table',
        url: MyCuckoo.api.getUrl(resourceObj),
        method: resourceObj.method,
        cellMinWidth: 100,
        height: MyCuckoo.tableHeight,
        // toolbar: '#ID_toolbar',
        toolbar: MyCuckoo.getActions(resources, 'table'),
        resources: resources,
        tree: {
          customName: {
            isParent: 'isParent',
            name: 'name'
          },
          view: {
            expandAllDefault: true
          }
        },
        cols: [col],
        page: false,
        done: function(res, curr, count) {
          new IndexMgr();
        }
      });
    });

    let path = location.pathname.substr(0, location.pathname.lastIndexOf('/')) + '/';
    let tab = window.parent.MyCuckoo;

    let indexMgrInst = null;
    const IndexMgr = function () {
      if (indexMgrInst) { //实例已存在
        return;
      }
      const that = indexMgrInst  = this;

      form.on('submit(search)', function(data) {
        //执行重载
        that.reload({where: data.field});

        return false;
      });

      //单元格工具事件
      table.on('tool(table)', function (obj) {
        let event = obj.event;
        let ele = obj.tr;
        let data = obj.data;

        obj.elem = this;
        that.on(obj);
      });

      table.on('toolbar(table)', function (obj) {
        if (obj.event.indexOf('LAYTABLE_') == 0) {
          return;
        }

        if (obj.event.endsWith('add')) {
          that.on(obj);
          return;
        }

        let data = table.checkStatus(obj.config.id).data;
        if (data.length != 1 || !data[0].id) {
          MyCuckoo.alert({title : '提示', msg : '请选择一条记录' });
          return;
        }

        obj.data = data[0];
        that.on(obj);
      });
    }

    IndexMgr.prototype = {
      constructor: IndexMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        if (!this[event]) {
          MyCuckoo.alert({title : '警示', msg : '此操作无效, 如有疑问, 请联系管理员!' });
          return;
        }

        this[event](obj);
      },
      reload: function(config) {
        table.reload('table', config || {});
      },
      //增加
      add: function(obj) {
        let url = MyCuckoo.resolve('moduleMgrForm.html?reskey={reskey}&action={action}',
            { ...queryObj, 'action': obj.event})
//        tab.tab('moduleMgrForm-create', '菜单信息', path + 'moduleMgrForm.html?action=create')
        MyCuckoo.dialog('菜单信息', url);
      },
      //修改
      modify: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('moduleMgrForm.html?reskey={reskey}&action={action}&id={id}',
            { ...queryObj, 'action': obj.event, 'id': data.id})
        MyCuckoo.dialog('菜单信息', url);
      },
      //查看
      view: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('moduleMgrForm.html?reskey={reskey}&action={action}&id={id}',
            { ...queryObj, 'action': obj.event, 'id': data.id})
        MyCuckoo.sideDialog('菜单信息', url);
      },
      //删除
      delete: function(obj) {
        let that = this;
        let data = obj.data;
        MyCuckoo.confirm({msg : '您确认删除此记录吗?', ok : function() {
          $.request(resourceMap[obj.event], obj.data).then(json => {
            MyCuckoo.msg({ msg: '菜单删除成功' });

            that.reload();
          });
        }});
      },
      //启用
      enable: function(obj) {
        let that = this;
        let data = obj.data;
        if(data.status == 'enable') {
          MyCuckoo.msg({ msg : '此菜单已经启用' });
          return;
        }
        if (data.level != 3) {
          MyCuckoo.msg({ msg : '请您选择第三级菜单!' });
          return;
        }

        $.request(resourceMap[obj.event], {id: data.id, disEnableFlag: 'enable'}).then(json => {
          MyCuckoo.msg({ msg: '菜单启用成功' });

          that.reload();
        });
      },
      //停用
      disable: function(obj) {
        let that = this;
        let data = obj.data;
        if(data.status == 'disable') {
          MyCuckoo.alert({ title : '提示', msg : '此菜单已经停用' });
          return;
        }
        if (data.level != 3) {
          MyCuckoo.alert({ msg : '请您选择第三级菜单!' });
          return;
        }

        MyCuckoo.confirm({msg : '您确认停用此菜单吗?如果停用,此菜单下的操作将自动清除,并重登生效.', ok : function() {
          $.request(resourceMap[obj.event], {id: data.id, disEnableFlag: 'disable'}).then(json => {
            MyCuckoo.msg({ msg: '菜单停用成功' });

            that.reload();
          });
        }});
      },
      //分配菜单操作
      assignOpt: function(obj) {
        let data = obj.data;
        if(data.level != 3) {
          MyCuckoo.alert({ msg: '请您选择第三级模块菜单'});
          return;
        }

        let url = MyCuckoo.resolve('moduleMgrAssignOpts.html?reskey={reskey}&action={action}&id={id}&name={name}',
          { ...queryObj, 'action': obj.event, 'id': data.id, 'name': data.name})
        MyCuckoo.dialog('模块信息', url);
      },
      //分配菜单资源
      assignRes: function(obj) {
        let data = obj.data;
        if(data.level != 3) {
          MyCuckoo.alert({ msg: '请您选择第三级模块菜单'});
          return;
        }

        let url = MyCuckoo.resolve('moduleMgrAssignRes.html?reskey={reskey}&action={action}&id={id}&name={name}',
          { ...queryObj, 'action': obj.event, 'id': data.id, 'name': data.name})
        MyCuckoo.dialog('模块: ' + data.name, url);
      },
      more: function (obj) {
        let that = this;
        let btns = MyCuckoo.getActions(resources, 'more');
        dropdown.render({
          elem: obj.elem,
          show: true,
          data: btns,
          customName: {
            title: 'name'
          },
          click: function(menudata) {
            obj.event = menudata.code;
            that.on(obj);
          }
        });
      }
    }
    //end
  });
</script>
</html>
