<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>系统平台</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
    }

    .mycuckoo-main {
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div class="mycuckoo-main">
  <div class="layui-row">
    <form class="layui-col-md12 layui-form mycuckoo-search">
      <div class="layui-inline">
        <div class="layui-input-inline">
          <input class="layui-input" name="keyword" placeholder="操作名称">
        </div>
        <div class="layui-input-inline">
          <button class="layui-btn" lay-filter="search" lay-submit>
            <i class="layui-icon">&#xe615;</i>
          </button>
        </div>
      </div>
    </form>
  </div>

  <table id="ID_table" class="layui-hide" lay-filter="table"></table>
</div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'dropdown', 'table'], function() {
    const $ = layui.jquery,
      form = layui.form,
      dropdown = layui.dropdown,
      table = layui.table;

    //本地缓存数据
    const queryObj = MyCuckoo.getQueryObject(location.search);
    const resources = MyCuckoo.getResource(queryObj.reskey);
    const resourceMap = MyCuckoo.getDictMap(resources);
    const resourceObj = MyCuckoo.getMainResource(resources);

    table.render({
      id: 'table',
      elem: '#ID_table',
      url: MyCuckoo.api.getUrl(resourceObj),
      method: resourceObj.method,
      cellMinWidth: 100,
      height: MyCuckoo.tableHeight,
      toolbar: MyCuckoo.getActions(resources, 'table'),
      resources: resources,
      cols: [[
        {type: 'numbers'},
        {type: 'radio'},
        {field: 'name', title: '名称'},
        {field: 'code', title: '编码'},
        {field: 'iconCls', title: '图标'},
        {field: 'order', title: '顺序'},
        {field: 'group', title: '操作组'},
        {field: 'status', title: '状态',
          templet: function(d) {
            if(d.status == 'enable') {
              return '启用';
            } else if(d.status == 'disable') {
              return '停用';
            }
          }
        },
        {field: 'createTime', title: '创建日期', sort: true},
        {fixed: "right", title: "操作", align: "center", width: 120, toolbar: MyCuckoo.getActions(resources, 'col'), resources: resources}
      ]],
      page: true,
      request: {
        pageName: 'pageNo',
        limitName: 'pageSize'
      },
      parseData: function(res) {
        return {
          code: res.code,
          msg: res.msg,
          count: res.data.totalElements,
          data: res.data.content
        }
      },
      done: function(res, curr, count) {
        new IndexMgr();
      }
    });

    let indexMgrInst = null;
    const IndexMgr = function () {
      if (indexMgrInst) { //实例已存在
        return;
      }
      const that = indexMgrInst = this;

      form.on('submit(search)', function(data) {
        //执行重载
        table.reload('table', {
          page: {pageNo: 1},
          where: data.field
        });

        return false;
      });

      //单元格工具事件
      table.on('tool(table)', function (obj) {
        obj.elem = this;
        that.on(obj);
      });

      table.on('toolbar(table)', function (obj) {
        if (obj.event.indexOf('LAYTABLE_') == 0) {
          return;
        }

        if (obj.event.endsWith('add')) {
          that.on(obj);
          return;
        }

        let data = table.checkStatus(obj.config.id).data;
        if (data.length != 1 || !data[0].id) {
          MyCuckoo.alert({title : '提示', msg : '请选择一条记录' });
          return;
        }

        obj.data = data[0];
        that.on(obj);
      });
    }

    IndexMgr.prototype = {
      constructor: IndexMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        if (!this[event]) {
          MyCuckoo.alert({title : '警示', msg : '此操作无效, 如有疑问, 请联系管理员!' });
          return;
        }

        this[event](obj);
      },
      reload: function() {
        table.reload('table', { page: { pageNo: 1 } });
      },
      //增加
      add: function(obj) {
        let url = MyCuckoo.resolve('operateMgrForm.html?reskey={reskey}&action={action}',
            { ...queryObj, 'action': obj.event})
        MyCuckoo.dialog('角色信息', url);
      },
      //修改
      modify: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('operateMgrForm.html?reskey={reskey}&action={action}&id={id}',
            { ...queryObj, 'action': obj.event, 'id': data.operateId})
        MyCuckoo.dialog('角色信息', url);
      },
      //查看
      view: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('operateMgrForm.html?reskey={reskey}&action={action}&id={id}',
            { ...queryObj, 'action': obj.event, 'id': data.operateId})
        MyCuckoo.sideDialog('角色信息', url);
      },
      //启用
      enable: function(obj) {
        let data = obj.data;
        if(data.status == 'enable') {
          MyCuckoo.msg({ msg : '此操作已经启用' });
          return;
        }

        let that = this;
        $.request(resourceMap[obj.event], {id: data.operateId, disEnableFlag: 'enable'}).then(json => {
          MyCuckoo.msg({ msg: '操作启用成功' });

          that.reload();
        });
      },
      //停用
      disable: function(obj) {
        let data = obj.data;
        if(data.status == 'disable') {
          MyCuckoo.alert({ title : '提示', msg : '此操作已经停用' });
          return;
        }

        let that = this;
        MyCuckoo.confirm({msg : '您确认停用此操作吗? 如果停用,相应模块下的此操作将自动清除,并重登生效.', ok : function() {
          $.request(resourceMap[obj.event], {id: data.operateId, disEnableFlag: 'disable'}).then(function(json) {
            MyCuckoo.msg({ msg: '操作停用成功' });

            that.reload();
          });
        }});
      },
      more: function (obj) {
        let that = this;
        let btns = MyCuckoo.getActions(resources, 'more');
        dropdown.render({
          elem: obj.elem,
          show: true,
          data: btns,
          customName: {
            title: 'name'
          },
          click: function(menudata) {
            obj.event = menudata.code;
            that.on(obj);
          }
        });
      }
      //end
    }
  });
</script>
