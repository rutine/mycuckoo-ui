<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>分配资源</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <!-- 标签风格 -->
  <style>
    .layui-form-radio > div.lay-skin-tag,
    .layui-form-checkbox > div.lay-skin-tag {
      font-size: 13px;
      border-radius: 100px;
      background-color: #D2D2D2;
    }

    .layui-form-checked > .lay-skin-tag,
    .layui-form-radioed > .lay-skin-tag {
      color: #fff !important;
      background-color: #16b777 !important;
    }

    /* 表单撑满，底部留出固定按钮的空间 */
    form[name=editForm] {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding-bottom: 50px;
      box-sizing: border-box;
    }

    /* 主体区：撑满剩余高度 */
    .mycuckoo-assign-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    /* 左栏 */
    .mycuckoo-assign-left {
      width: 25%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e6e6e6;
      min-width: 0;
    }

    /* 右栏 */
    .mycuckoo-assign-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* 树容器：撑满并滚动 */
    .mycuckoo-tree-wrap {
      flex: 1;
      overflow: auto;
      padding: 6px 0;
      min-height: 0;
    }

    /* 配置容器：撑满并滚动 */
    .mycuckoo-config-wrap {
      flex: 1;
      overflow: auto;
      padding: 0 10px;
      min-height: 0;
    }

    /* 配置行 */
    .mycuckoo-checkbox-set {
      border-bottom: 1px solid #f0f0f0;
      padding: 6px 0;
    }

    .mycuckoo-checkbox-set:hover {
      background: #fafafa;
    }

    /* 底部按钮：固定底部 */
    .layui-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50px;
      line-height: 50px;
      padding: 0 10px;
      background: #fff;
      border-top: 1px solid #e6e6e6;
      text-align: right;
      box-sizing: border-box;
      z-index: 10;
    }
  </style>
</head>
<body>
<form class="layui-form" name="editForm" lay-filter="moduleAssignResource">
  <div class="mycuckoo-assign-body">
    <!-- 左：选择资源 -->
    <div class="mycuckoo-assign-left">
      <div class="layui-card-header" style="font-weight: bold;">选择资源</div>
      <div class="mycuckoo-tree-wrap">
        <div id="ID_mycuckoo-tree"></div>
      </div>
    </div>

    <!-- 右：配置资源 -->
    <div class="mycuckoo-assign-right">
      <div class="layui-card-header layui-row" style="padding: 0 10px;">
        <div class="layui-col-sm3" style="font-weight: bold; line-height: 40px;">配置资源</div>
        <div class="layui-col-sm9" style="font-weight: bold; line-height: 40px;">应用位置</div>
      </div>
      <div class="mycuckoo-config-wrap"></div>
    </div>
  </div>

  <!-- 底部按钮 -->
  <div class="layui-footer toolbar"></div>
</form>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'tree'], function() {
    const $ = layui.jquery,
      form = layui.form,
      tree = layui.tree,
      queryObj = MyCuckoo.getQueryObject(location.search),
      resources = MyCuckoo.getResource(queryObj.reskey),
      resourceMap = MyCuckoo.getDictMap(resources),
      resourceObj = resourceMap[queryObj.action],
      $form = $('form[name=editForm]');

    const FormMgr = function () {
      const that = this;

      //渲染操作按钮
      $form.find('.toolbar').html(MyCuckoo.getActions(resourceObj || {}, 'form'));

      //表单初始赋值
      if (queryObj.id) {
        $.request(resourceMap[MyCuckoo.res.moduleMgr.resSelector], queryObj).then(function(json) {
          let source = json.data.source;
          let $elem = $form.find('.mycuckoo-config-wrap');

          //初始化结构树
          tree.render({
            elem: '#ID_mycuckoo-tree',
            id: 'ID-mycuckoo-tree',
            showCheckbox: true,
            showLine: true,
            data: source,
            customName: {
              title: 'text'
            },
            oncheck: function(obj) {
              let data = obj.data;

              that.rend($elem, data, obj.checked, source);

              form.render('checkbox', 'moduleAssignResource')
            }
          });

          tree.setChecked('ID-mycuckoo-tree', json.data.assign);
          that.rend($elem, source, false, source, json.data.assign);
          form.render('checkbox', 'moduleAssignResource')
        });
      } else {
        MyCuckoo.alert({ title : '提示', msg : '请关闭后选择模块!' });
        return;
      }

      //操作按钮触发事件
      $form.find('a.layui-btn:not([lay-submit])').on('click', function() {
        let event = $(this).data('event');
        that.on({event: event, elem: this});
      });

      //监听提交
      form.on('submit', function(data) {
        let event = $(this).data('event');
        that.on({event: event, data: $.extend({}, data.field, queryObj)});

        return false;
      });
    }

    FormMgr.prototype = {
      constructor: FormMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        this[event] && this[event](obj);
      },
      rend: function (elem, data, checked, source, assign) {
        let hideBi = 1 << 9;
        if (Array.isArray(data)) {
          for (let p in data) {
            this.rend(elem, data[p], checked, source, assign);
          }
        } else if (data && data.children && data.children.length > 0) {
          for (let p in data.children) {
            this.rend(elem, data.children[p], checked, source, assign);
          }
        } else {
          checked = checked || data.checked || (Array.isArray(assign) && assign.includes(data.id));
          delete data.checked;

          let $checkbox = elem.find('.mycuckoo-checkbox-set-' + data.id);
          if (!checked) {
            $checkbox.addClass('layui-hide');
            return
          }
          if ($checkbox.length) {
            $checkbox.removeClass('layui-hide');
            return;
          }
          let arr = []
          let text = this.getParentText(data.parentId, source)
          if (text) {
            arr.push(text);
          }
          arr.push(data.text);

          elem.append([
            '<div class="layui-row mycuckoo-checkbox-set mycuckoo-checkbox-set-' + data.id + '" data-id="' + data.id + '">',
            ' <div class="layui-col-sm3 layui-font-green" style="line-height: 32px;">',
            function () {
              return '<span class="layui-badge"><span>' + arr.join('</span><span> => </span><span>') + '</span></span>';
            }(),
            ' </div>',
            ' <div class="layui-col-sm9" style="line-height: 32px;">',
            '   <input type="checkbox" name="resGroup" lay-skin="none" value="1" ' + ((data.group & 1) == 1 ? 'checked' : '') + '>',
            '   <div lay-checkbox class="lay-skin-tag layui-badge">列表</div>',
            '   <input type="checkbox" name="resGroup" lay-skin="none" value="2" ' + ((data.group & 2) == 2 ? 'checked' : '') + '>',
            '   <div lay-checkbox class="lay-skin-tag layui-badge">工具栏</div>',
            '   <input type="checkbox" name="resGroup" lay-skin="none" value="4" ' + ((data.group & 4) == 4 ? 'checked' : '') + '>',
            '   <div lay-checkbox class="lay-skin-tag layui-badge">操作栏</div>',
            '   <input type="checkbox" name="resGroup" lay-skin="none" value="8" ' + ((data.group & 8) == 8 ? 'checked' : '') + '>',
            '   <div lay-checkbox class="lay-skin-tag layui-badge">表单</div>',
            '   <input type="checkbox" name="resGroup" lay-skin="none" value="' + hideBi + '" ' + ((data.group & hideBi) == hideBi ? 'checked' : '') + '>',
            '   <div lay-checkbox class="lay-skin-tag layui-badge">不显示</div>',
            ' </div>',
            '</div>'
          ].join(''));
        }
      },
      getParentText: function (parentId, data) {
        if (Array.isArray(data)) {
          for (let one in data) {
            let text = this.getParentText(parentId, data[one]);
            if (text) {
              return text
            }
          }
          return
        }

        if (parentId == '0' || parentId == data.parentId) {
          return null;
        }

        for (let one in data.children) {
          let text = this.getParentText(parentId, data.children[one]);
          if (text) {
            return text
          }
        }

        if (data.id == parentId) {
          return data.text;
        }

        return null;
      },
      //保存用户权限
      assignRes: function(obj) {
        let main = 0;
        let resource = [];
        $checkboxSet = $form.find('.mycuckoo-checkbox-set:not(.layui-hide)');
        if(!$checkboxSet.length) {
          MyCuckoo.alert({ title : '提示', msg : '请选择资源!' });
          return;
        }

        for (let i = 0; i < $checkboxSet.length; i++) {
          let $ele = $checkboxSet.eq(i);
          let $checkGrp = $ele.find('input:checkbox:checked');
          if (!$checkGrp.length) {
            MyCuckoo.msg({ title : '提示', msg : '请给[' + $ele.find('.layui-col-sm3').text() + ']配置应用位置!' });
            return;
          }

          let grp = 0;
          for (let ii = 0; ii < $checkGrp.length; ii++) {
            let elee = $checkGrp[ii];
            let value = parseInt(elee.value);
            if (main == 0 && value == 1) {
              main =  value;
            } else if (main == value && value == 1) {
              MyCuckoo.alert({ title : '提示', msg : '应用位置只允许选择一个列表!' });
              return;
            }
            grp |= value
          }

          let id = $ele.data('id');
          resource.push({
            resourceId: id.indexOf('id-leaf-') >= 0 ? id.substr('id-leaf-'.length) : id,
            group: grp
          })
        }

        let that = this;
        $.request(resourceObj, obj.data, resource).then(json => {
          MyCuckoo.msg({msg: json.msg});

          setTimeout(function() {
            that.close();
          }, 1500);
        });
      },
      //刷新父窗
      refresh: function() {
        setTimeout(function() {
          parent.location.reload();
        }, 1500);
      },
      //关闭当前iframe页
      close: function() {
        let index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
      }
    }

    new FormMgr();
    //end
  });
</script>
</body>
</html>
