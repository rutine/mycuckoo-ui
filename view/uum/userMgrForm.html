<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>用户信息</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/dtree.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/font/dtreefont.css" rel="stylesheet" />
</head>
<body>
<div class="mycuckoo-main">
  <form class="layui-form layui-form-pane" name="editForm" lay-filter="editForm">
    <input type="hidden" name="userId" />
    <div class="layui-form-item">
      <div class="layui-inline">
        <label class="layui-form-label">用户名</label>
        <div class="layui-input-inline">
          <input type="text" name="name" class="layui-input" lay-verify="required" maxlength="60" />
        </div>
      </div>
      <div class="layui-inline">
        <div class="layui-input-block">
          <div class="layui-upload">
            <input type="hidden" name="photoFileId" />
            <div class="layui-upload-list">
              <img id="ID_filePicker" style="max-height: 120px; max-width: 120px;" class="layui-upload-img" src="../../static/images/form/blank_userphoto.gif" title="用户照片" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="layui-inline">
        <label class="layui-form-label">性别</label>
        <div class="layui-input-inline">
          <input type="radio" name="gender" value="0" title="男" checked="">
          <input type="radio" name="gender" value="1" title="女">
        </div>
      </div>
      <div class="layui-inline">
        <label class="layui-form-label">职位</label>
        <div class="layui-input-inline">
          <input type="text" name="position" class="layui-input" maxlength="20" />
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="layui-inline">
        <label class="layui-form-label">手机号</label>
        <div class="layui-input-inline">
          <input type="text" name="phone" class="layui-input" lay-verify="phone" maxlength="20" />
        </div>
      </div>
      <div class="layui-inline">
        <label class="layui-form-label">邮箱</label>
        <div class="layui-input-inline">
          <input type="text" name="email" class="layui-input" lay-verify="email" maxlength="30" />
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="layui-inline">
        <label class="layui-form-label">家庭住址</label>
        <div class="layui-input-inline">
          <input type="text" name="address" class="layui-input" maxlength="100" />
        </div>
      </div>
      <div class="layui-inline">
        <label class="layui-form-label">用户有效期</label>
        <div class="layui-input-inline">
          <input type="text" name="avidate" class="layui-input" placeholder="yyyy-MM-dd" lay-verify="date" readonly />
        </div>
      </div>
    </div>

    <div class="layui-form-item">
      <div class="layui-inline">
        <label class="layui-form-label">所属部门</label>
        <div class="layui-input-inline">
          <div class="layui-input-wrap">
            <input type="hidden" name="deptId" />
            <input type="text" name="deptName" class="layui-input" lay-affix="search"
                   data-event="selectDept" lay-filter="selectDept" lay-verify="required" readonly />
          </div>
        </div>
      </div>
      <div class="layui-inline">
        <label class="layui-form-label">所属角色</label>
        <div class="layui-input-inline">
          <div class="layui-input-wrap">
            <input type="hidden" name="roleId" />
            <input type="text" name="roleName" class="layui-input" lay-affix="search"
                   data-event="selectRole" lay-filter="selectRole" lay-verify="required" readonly />
          </div>
        </div>
      </div>
    </div>

    <div class="layui-form-item layui-form-text">
      <label class="layui-form-label">备注</label>
      <div class="layui-input-block">
        <textarea name="memo" class="layui-textarea" placeholder="请输入内容" maxlength="50" ></textarea>
      </div>
    </div>

    <div class="toolbar"></div>
  </form>
</div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'laydate', 'dtree', 'upload'], function() {
    const $ = layui.jquery,
      form = layui.form,
      layer = layui.layer,
      layDate = layui.laydate,
      tree = layui.dtree,
      upload = layui.upload,
      queryObj = MyCuckoo.getQueryObject(location.search),
      resources = MyCuckoo.getResource(queryObj.reskey),
      resourceMap = MyCuckoo.getDictMap(resources),
      resourceObj = resourceMap[queryObj.action],
      $form = $('form[name=editForm]');

    const FormMgr = function() {
      const that = this;

      //渲染操作按钮
      $form.find('.toolbar').html(MyCuckoo.getActions(resourceObj || {}, 'form'));

      //表单初始赋值
      if (queryObj.id && resourceObj.canAccess()) {
        $.request(resourceMap[MyCuckoo.res.userMgr.view], queryObj).then(json => {
          form.val('editForm', json.data);

          if (resourceObj.code === MyCuckoo.res.userMgr.view) {
            $form.find('input, select, textarea').attr('disabled', 'disabled')
          }
          if(json.data.photoUrl) {
            $form.find('img#ID_filePicker').attr('src', json.data.photoUrl)
          }
        });
      }

      //日期
      layDate.render({
        elem: 'input[name=avidate]'
      });

      //更换头像
      upload.render({
        elem: '#ID_filePicker',
        url: MyCuckoo.api.fileMgr.url,
        accept: 'images',
        data: {type: 'PHOTO'},
        done: function(res, index, upload) {
          if(res.code == 0) { //上传成功
            $form.find('img#ID_filePicker').attr('src', res.data.url);
            $form.find('input[name=photoFileId]').val(res.data.id);
            return;
          }
          this.error(index, upload);
        },
        error: function(index, upload) {
          MyCuckoo.alert({title : '提示', msg : '上传头像失败!' });
        }
      });

      //操作按钮触发事件
      $form.find('a.layui-btn:not([lay-submit])').on('click', function() {
        let event = $(this).data('event');
        that.on({event: event, elem: this});
      });

      form.on('input-affix', function(data) {
        let elem = data.elem; // 获取输入框 DOM 对象
        let affix = data.affix; // 获取输入框 lay-affix 属性值
        let event = $(elem).data('event');
        $(elem).attr('disabled') != 'disabled' && that.on({event: event, elem: this});
      });

      //监听提交
      form.on('submit', function(data) {
        let event = $(this).data('event');
        that.on({event: event, data: data.field});

        return false;
      });
    }

    FormMgr.prototype = {
      constructor: FormMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        this[event] && this[event](obj);
      },
      openTree: function(url, config) {
        let withRole = (config['nodeId'] === 'roleId');
        let fillForm = function(data) {
          let valObj =  {};
          for (let p in config) {
            if (typeof p == 'string') {
              let index = !isNaN(data[p]) ? -1 : data[p].indexOf('_');
              let val = index != -1 ? data[p].substr(index + 1) : data[p]
              if (val.indexOf('id-leaf') >= 0) {
                val = val.replace('id-leaf-', '')
              }
              valObj[config[p]] = val;
            }
          }
          form.val('editForm', valObj);
        }

        layer.open({
          type: 1,
          title: "选择角色",
          area: ["400px", "80%"],
          content: '<ul id="ID_tree" class="dtree" data-id="1"></ul>',
          btn: ['确认选择'],
          success: function(layero, index){
            let treeObj = tree.render({
              elem: '#ID_tree',
              method: 'get',
              type: 'all',
              url: MyCuckoo.resolvePlaceholder(url, {id: 1}),
              request: {isCheckbox: true, withRole: withRole},
              dataStyle: 'layuiStyle',
              response: { statusCode: 0, treeId: 'id', title: 'text', isLast: 'isLeaf', checkArr: 'checkbox'},
//              checkbar: true,
//              dot: false,
//              icon: ['-1', '1']
            });
            tree.on('nodedblclick(ID_tree)', function(obj) {
              let data = obj.param;
              if(!data.isLeaf) {
                return;
              }

              fillForm(data);
              layer.close(index);
            })
          },
          yes: function(index, layero) {
//            let params = tree.getCheckbarNodesParam('ID_tree');
            let param = tree.getNowParam('ID_tree');
            if(withRole && !param.nodeId.startsWith('id-leaf-')) {
              MyCuckoo.alert({msg: '请选择一个角色'});
              return;
            }

            fillForm(param);
            layer.close(index);
          }
        });
      },
      selectDept: function(ele) {
        let action = resourceMap[MyCuckoo.res.deptMgr.tree];
        if (!action.canAccess()) {
          MyCuckoo.msg({msg: '无权访问此资源'});
          return;
        }

        this.openTree(MyCuckoo.api.getUrl(action), {nodeId: 'deptId', context: 'deptName'});
      },
      selectRole: function(ele) {
        let action = resourceMap[MyCuckoo.res.deptMgr.tree];
        if (!action.canAccess()) {
          MyCuckoo.msg({msg: '无权访问此资源'});
          return;
        }

        this.openTree(MyCuckoo.api.getUrl(action), {nodeId: 'roleId', context: 'roleName'});
      },
      add: function(obj) {
        $.request(resourceObj, obj.data).then(json => {
          MyCuckoo.msg({msg: json.msg});

          this.refresh();
        });
      },
      modify: function(obj) {
        $.request(resourceObj, obj.data).then(json => {
          MyCuckoo.msg({msg: json.msg});

          this.refresh();
        });
      },
      //刷新父窗
      refresh: function() {
        setTimeout(function() {
          parent.location.reload();
        }, 1500);
      },
      //关闭当前iframe页
      close: function() {
        let index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
      }
    }

    new FormMgr();
    //end
  });
</script>
</html>
