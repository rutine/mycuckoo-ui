<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>统一用户</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
    }

    .mycuckoo-main {
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>
<body>
<div class="mycuckoo-main">
  <div class="layui-row">
    <form class="layui-col-md12 layui-form mycuckoo-search">
      <div class="layui-inline">
        <div class="layui-input-inline">
          <input class="layui-input" name="q[name]" placeholder="名称">
        </div>
        <div class="layui-input-inline">
          <button class="layui-btn" lay-filter="search" lay-submit>
            <i class="layui-icon">&#xe615;</i>
          </button>
        </div>
      </div>
    </form>
  </div>

  <table id="ID_table" class="layui-hide" lay-filter="table"></table>
</div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.api.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'dropdown', 'treeTable'], function() {
    const $ = layui.jquery,
      form = layui.form,
      dropdown = layui.dropdown,
      table = layui.treeTable;

    //本地缓存数据
    const queryObj = MyCuckoo.getQueryObject(location.search);
    const operator = MyCuckoo.getOperation(queryObj.id);
    const operatorMap = MyCuckoo.getDictMap(operator);
    const action = MyCuckoo.getIndexAction(operator);

    const treeTable = table.render({
      id: 'table',
      elem: '#ID_table',
      url: MyCuckoo.api.host + action.path,
      method: action.method,
      cellMinWidth: 100,
      height: MyCuckoo.tableHeight,
      toolbar: MyCuckoo.getActions(operator, 'table'),
      operator: operator,
      tree: {
        customName: {
          name: 'text'
        },
        view: {
          expandAllDefault: true
        }
      },
      cols: [[
        {type: 'radio'},
        {type: 'numbers'},
        {field: 'text', title: '名称', width: 200},
        {field: 'roleName', title: '所属角色', width: 200},
        {field: 'status', title: '状态', width: 50,
          templet: function(d) {
            if(d.status == 'enable') {
              return '启用';
            } else if(d.status == 'disable') {
              return '停用';
            }
            return '';
          }
        },
        {fixed: "right", title: "操作", align: "center", toolbar: MyCuckoo.getActions(operator, 'col'), operator: operator}
      ]],
      page: false,
      parseData: function(res) {
        return {
          code: res.code,
          msg: '',
          count: res.data.length,
          data: res.data
        }
      },
      done: function(res, curr, count) {
        new IndexMgr();
      }
    });

    let indexMgrInst = null;
    const IndexMgr = function () {
      if (indexMgrInst) { //实例已存在
        return;
      }
      const that = indexMgrInst = this;

      form.on('submit(search)', function(data) {
        //执行重载
        table.reload('table', {
          where: data.field
        });

        return false;
      });

      //单元格工具事件
      table.on('tool(table)', function (obj) {
        obj.elem = this;
        that.on(obj);
      });

      table.on('toolbar(table)', function (obj) {
        if (obj.event.indexOf('LAYTABLE_') == 0) {
          return;
        }
        if (obj.event.endsWith('add')) {
          that.on(obj);
          return;
        }

        let data = table.checkStatus(obj.config.id).data;
        if (data.length != 1 || !data[0].id) {
          MyCuckoo.alert({title: '提示', msg: '请选择一条记录'});
          return;
        }

        obj.data = data[0];
        that.on(obj);
      });
    }

    IndexMgr.prototype = {
      constructor: IndexMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        if (!this[event]) {
          MyCuckoo.alert({title : '警示', msg : '此操作无效, 如有疑问, 请联系管理员!' });
          return;
        }

        this[event](obj);
      },
      reload: function() {
        table.reload('table', { page: { pageNo: 1 } });
      },
      //增加
      add: function(obj) {
        let url = MyCuckoo.resolve('deptMgrForm.html?action={action}&opt={opt}',
            {'action': obj.event, 'opt': queryObj.id})
        MyCuckoo.dialog('部门信息', url);
      },
      //修改
      modify: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('deptMgrForm.html?action={action}&opt={opt}&id={id}',
            {'action': obj.event, 'opt': queryObj.id, 'id': data.id})
        MyCuckoo.dialog('部门信息', url);
      },
      //查看
      view: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('deptMgrForm.html?action={action}&opt={opt}&id={id}',
            {'action': obj.event, 'opt': queryObj.id, 'id': data.id})
        MyCuckoo.sideDialog('部门信息', url);
      },
      //分配
      assign: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('roleMgrSelector.html?action={action}&opt={opt}&id={id}',
          {'action': obj.event, 'opt': queryObj.id, 'id': data.id})
        MyCuckoo.dialog('角色信息', url);
      },
      //启用
      enable: function(obj) {
        let data = obj.data;
        if(data.status == 'enable') {
          MyCuckoo.msg({ msg : '此部门已经启用' });
          return;
        }

        let that = this;
        $.request(operatorMap[obj.event], {id: data.id, disEnableFlag: 'enable'}).then(json => {
          MyCuckoo.msg({ msg: '部门启用成功' });

          that.reload();
        });
      },
      //停用
      disable: function(obj) {
        let data = obj.data;
        if(data.status == 'disable') {
          MyCuckoo.alert({ title : '提示', msg : '此部门已经停用' });
          return;
        }

        let that = this;
        MyCuckoo.confirm({msg : '您确认停用此部门吗.', ok : function() {
          $.request(operatorMap[obj.event], {id: data.id, disEnableFlag: 'disable'}).then(function(json) {
            MyCuckoo.msg({ msg: '部门停用成功' });

            that.reload();
          });
        }});
      },
      more: function (obj) {
        let that = this;
        let btns = MyCuckoo.getActions(operator, 'more');
        dropdown.render({
          elem: obj.elem,
          show: true,
          data: btns,
          customName: {
            title: 'name'
          },
          click: function(menudata) {
            obj.event = menudata.code;
            that.on(obj);
          }
        });
      }
    }
    // the end
  });
</script>
</html>
