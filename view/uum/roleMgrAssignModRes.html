<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>分配权限</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/dtree.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/font/dtreefont.css" rel="stylesheet" />
  <style>
    .role-assign-page { height: 100vh; overflow: hidden; }
    .role-assign-page .role-assign-tree-item > .layui-input-block { height: calc(100vh - 230px); max-height: none; overflow-x: hidden; overflow-y: auto; }
    .role-assign-page .role-assign-tree-item .dtree { width: 100%; min-height: 100%; box-sizing: border-box; }
    .role-assign-page .role-assign-actions { position: fixed; right: 0; bottom: 8px; left: 0; z-index: 1; margin: 0; text-align: center; }
  </style>
</head>
<body class="role-assign-page">
  <div class="mycuckoo-main" style="padding: 0">
    <div class="layui-tab">
      <ul class="layui-tab-title">
        <li class="layui-this">模块操作权限分配</li>
        <li>行权限分配</li>
      </ul>
      <div class="layui-tab-content">
        <div class="layui-tab-item layui-show">
          <form class="layui-form layui-form-pane" name="roleAssignModOpt" lay-filter="roleAssignModOpt">
            <div class="layui-form-item">
              <label class="layui-form-label">权限范围</label>
              <div class="layui-input-block">
                <input type="radio" name="privilegeScope" value="inc" title="包含操作">
                <input type="radio" name="privilegeScope" value="exc" title="不包含操作">
                <input type="radio" name="privilegeScope" value="all" title="全部(无需分配操作)">
              </div>
            </div>

            <div class="layui-form-item role-assign-tree-item">
              <label class="layui-form-label">模块</label>
              <div class="layui-input-block">
                <ul id="ID_tree" lay-filter="tree"></ul>
              </div>
            </div>

            <div class="layui-btn-container role-assign-actions">
              <a href="javascript:" class="layui-btn layui-btn-sm" data-event="assignRes" lay-submit>
                <i class="layui-icon layui-icon-ok"></i>保存
              </a>
              <a href="javascript:" class="layui-btn layui-btn-sm" data-event="close">
                <i class="layui-icon layui-icon-close"></i>取消
              </a>
            </div>
          </form>
        </div>

        <div class="layui-tab-item">
          <form class="layui-form layui-form-pane" name="roleAssignRowPriv" lay-filter="roleAssignRowPriv">
            <div class="layui-form-item">
              <label class="layui-form-label">权限范围</label>
              <div class="layui-input-block">
                <input type="radio" name="rowPrivilege" value="dept" title="部门">
                <input type="radio" name="rowPrivilege" value="rol" title="角色">
                <input type="radio" name="rowPrivilege" value="urs" title="用户">
              </div>
            </div>

            <div class="layui-btn-container role-assign-actions">
              <a href="javascript:" class="layui-btn layui-btn-sm" data-event="assignRow" lay-submit>
                <i class="layui-icon layui-icon-ok"></i>保存
              </a>
              <a href="javascript:" class="layui-btn layui-btn-sm" data-event="close">
                <i class="layui-icon layui-icon-close"></i>取消
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'dtree'], function() {
    const $ = layui.jquery,
      form = layui.form,
      tree = layui.dtree,
      queryObj = MyCuckoo.getQueryObject(location.search),
      resources = MyCuckoo.getResource(queryObj.reskey),
      resourceMap = MyCuckoo.getDictMap(resources),
      $main = $('.mycuckoo-main');


    let treeObj;
    const FormMgr = function () {
      //表单初始赋值
      if (queryObj.id) {
        $.request(resourceMap[MyCuckoo.res.roleMgr.resSelector], queryObj).then(json => {
          form.val('roleAssignModOpt', json.data);
          form.val('roleAssignRowPriv', json.data);

          //初始化结构树
          treeObj = tree.render({
            elem: '#ID_tree',
            method: 'get',
            data: json.data.privileges,
            dataStyle: 'layuiStyle',
            response: { statusCode: 0, treeId: 'id', title: 'text', isLast: 'isLeaf', checkArr: 'checkbox'},
            checkbar: true,
            dot: false,
            icon: ['-1', '1'],
//          done: function() {
//            treeObj.chooseDataInit(json.data.assign.join(','));
//          }
          });
        });
      } else {
        MyCuckoo.alert({ title : '提示', msg : '请关闭后选择角色!' });
        return;
      }

      const formMgr = this;
      //操作按钮触发事件
      $main.find('a.layui-btn:not([lay-submit])').on('click', function() {
        let event = $(this).data('event');
        formMgr[event] && formMgr[event]({event: event, elem: this});
      });

      //监听提交
      form.on('submit', function(data) {
        let event = $(this).data('event');
        formMgr[event] && formMgr[event]({event: event, data: $.extend({}, data.field, queryObj)});

        return false;
      });
    }

    FormMgr.prototype = {
      constructor: FormMgr,
      //保存用户权限
      assignRes: function(obj) {
        let data = obj.data;
        if(!data.privilegeScope) {
          MyCuckoo.alert({ title : '提示', msg : '请选择权限范围!' });
          return;
        }

        let selectedNodes = treeObj.getCheckbarNodesParam();
        if(!selectedNodes.length) {
          MyCuckoo.alert({ title : '提示', msg : '请选择权限!' });
          return;
        }

        let optIds = [];
        selectedNodes.forEach(item => item.isLeaf && optIds.push(item.nodeId));
        $.request(resourceMap[MyCuckoo.res.roleMgr.assignRes], data, optIds).then(json => {
          MyCuckoo.msg({msg: json.msg});

          this.refresh();
        });
      },
      //保存行权限
      assignRow: function(obj) {
        let data = obj.data;
        if(!data.rowPrivilege) {
          MyCuckoo.alert({ title : '提示', msg : '请选择行权限类别!' });
          return;
        }

        $.request(resourceMap[MyCuckoo.res.roleMgr.assignRow], data, rowIds).then(json => {
          MyCuckoo.msg({msg: json.msg});

          this.refresh();
        });
      },
      //刷新父窗
      refresh: function() {
        setTimeout(function() {
          parent.location.reload();
        }, 1500);
      },
      //关闭当前iframe页
      close: function() {
        let index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
      }
    }

    new FormMgr();
    //end
  });
</script>
</html>
