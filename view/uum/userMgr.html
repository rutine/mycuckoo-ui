<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>统一用户</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.11.4/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/dtree.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/font/dtreefont.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
</head>
<body>
<div class="mycuckoo-main">
  <div class="layui-row">
    <form class="layui-col-md12 layui-form mycuckoo-search">
      <div class="layui-inline">
        <div class="layui-input-inline">
          <input class="layui-input" name="q[code]" placeholder="用户号">
        </div>
        <div class="layui-input-inline">
          <input class="layui-input" name="q[name]" placeholder="用户名">
        </div>
        <div class="layui-input-inline">
          <button class="layui-btn" lay-filter="search" lay-submit>
            <i class="layui-icon">&#xe615;</i>
          </button>
        </div>
      </div>

      <div class="mycuckoo-right">
        <a class="layui-btn layui-bg-gray" href="javascript:location.replace(location.href);" title="刷新">
          <i class="layui-icon layui-icon-refresh"></i>
        </a>
      </div>
    </form>
  </div>

  <table id="ID_table" class="layui-hide" lay-filter="table"></table>
</div>
</body>
<script type="text/javascript" src="../../static/layui/2.11.4/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.api.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'dropdown', 'table', 'dtree'], function() {
    const $ = layui.jquery,
      form = layui.form,
      dropdown = layui.dropdown,
      tree = layui.dtree,
      table = layui.table;

    //本地缓存数据
    const queryObj = MyCuckoo.getQueryObject(location.search);
    const operator = MyCuckoo.getOperation(queryObj.id);
    const operatorMap = MyCuckoo.getDictMap(operator);
    const action = MyCuckoo.getIndexAction(operator);

    table.render({
      id: 'table',
      elem: '#ID_table',
      url: MyCuckoo.api.host + action.path,
      method: action.method,
      cellMinWidth: 100,
      height: MyCuckoo.tableHeight,
      toolbar: MyCuckoo.getActions(operator, 'table'),
      operator: operator,
      cols: [[
        {type: 'numbers'},
        {type: 'radio'},
        {field: 'name', title: '名称'},
        {field: 'gender', title: '性别',
          templet: function(d) {
            if(d.gender == '0') {
              return '男';
            } else if(d.gender == '1') {
              return '女';
            }
          }
        },
        {field: 'position', title: '职位'},
        {field: 'phone', title: '手机号'},
        {field: 'email', title: '邮箱'},
        {field: 'orgName', title: '所属机构'},
        {field: 'roleName', title: '所属角色'},
        {field: 'status', title: '用户状态',
          templet: function(d) {
            if(d.status == 'enable') {
              return '启用';
            } else if(d.status == 'disable') {
              return '停用';
            }
          }
        },
        {field: 'createTime', title: '创建日期', sort: true},
        {fixed: "right", title: "操作", align: "center", width: 120, toolbar: MyCuckoo.getActions(operator, 'col'), operator: operator}
      ]],
      page: true,
      request: {
        pageName: 'pageNo',
        limitName: 'pageSize'
      },
      parseData: function(res) {
        return {
          code: res.code,
          msg: res.msg,
          count: res.data.totalElements,
          data: res.data.content
        }
      },
      done: function(res, curr, count) {
        new IndexMgr();
      }
    });

    let indexMgrInst = null;
    const IndexMgr = function () {
      if (indexMgrInst) { //实例已存在
        return;
      }
      const that = indexMgrInst = this;

      form.on('submit(search)', function (data) {
        //执行重载
        table.reload('table', {
          page: {pageNo: 1},
          where: data.field
        });

        return false;
      });

      //单元格工具事件
      table.on('tool(table)', function (obj) {
        obj.elem = this;
        that.on(obj);
      });

      table.on('toolbar(table)', function (obj) {
        if (obj.event.indexOf('LAYTABLE_') == 0) {
          return;
        }
        if (obj.event.endsWith('add')) {
          that.on(obj);
          return;
        }

        let data = table.checkStatus(obj.config.id).data;
        if (data.length != 1) {
          MyCuckoo.alert({title: '提示', msg: '请选择一条记录'});
          return;
        }

        obj.data = data[0];
        that.on(obj);
      });
    }

    IndexMgr.prototype = {
      constructor: IndexMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        if (!this[event]) {
          MyCuckoo.alert({title : '警示', msg : '此操作无效, 如有疑问, 请联系管理员!' });
          return;
        }

        this[event](obj);
      },
      reload: function() {
        table.reload('table', { page: { pageNo: 1 } });
      },
      //增加
      add: function(obj) {
        let url = MyCuckoo.resolve('userMgrForm.html?action={action}&opt={opt}',
            {'action': obj.event, 'opt': queryObj.id})
        MyCuckoo.dialog('用户信息', url);
      },
      //修改
      modify: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('userMgrForm.html?action={action}&opt={opt}&id={id}',
            {'action': obj.event, 'opt': queryObj.id, 'id': data.userId})
        MyCuckoo.dialog('用户信息', url);
      },
      //查看
      view: function(obj) {
        let data = obj.data;
        let url = MyCuckoo.resolve('userMgrForm.html?action={action}&opt={opt}&id={id}',
            {'action': obj.event, 'opt': queryObj.id, 'id': data.userId})
        MyCuckoo.dialog('用户信息', url);
      },
      //删除
      delete: function(obj) {
        let data = obj.data;
        let that = this;
        MyCuckoo.confirm({title: '警告提示', msg: '您确认删除此记录吗?',
          okBtn: '是', cancelBtn: '否', ok: function() {
            $.request(operatorMap[obj.event], {id: data.userId}).then(json => {
              MyCuckoo.msg({ msg: json.msg });

              that.reload();
            });
          }});
      },
      //启用
      enable: function(obj) {
        let data = obj.data;
        if(data.status == 'enable') {
          MyCuckoo.msg({ msg : '此用户已经启用' });
          return;
        }

        let that = this;
        $.request(operatorMap[obj.event], {id: data.userId, disEnableFlag: 'enable'}).then(json => {
          MyCuckoo.msg({ msg: '用户启用成功' });

          that.reload();
        });
      },
      //停用
      disable: function(obj) {
        let data = obj.data;
        if(data.status == 'disable') {
          MyCuckoo.alert({ title : '提示', msg : '此用户已经停用' });
          return;
        }

        let that = this;
        MyCuckoo.confirm({msg : '您确认停用此用户?如停用,此用户将归入无角色用户并自动清除所有权限.', ok : function() {
          $.request(operatorMap[obj.event], {id: data.userId, disEnableFlag: 'disable'}).then(function(json) {
            MyCuckoo.msg({ msg: '用户停用成功!此用户将不能在使用本系统' });

            that.reload();
          });
        }});
      },
      //重置密码
      resetPwd: function(obj) {
        let data = obj.data;
        MyCuckoo.confirm({msg : '您确认要重置此用户密码?', ok : function() {
          $.request(operatorMap[obj.event], {id: data.userId}, data.userName).then(function(json) {
            MyCuckoo.msg({ msg: json.msg });
          });
        }});
      },
      assign: function(obj) {
        let data = obj.data;
        layer.open({
          type: 1,
          title: "选择角色",
          area: ["400px", "80%"],
          content: '<ul id="ID_tree" class="dtree" data-id="1"></ul>',
          btn: ['确认选择'],
          success: function(layero, index) {
            let action = operatorMap['res:deptMgr:tree'];
            let treeObj = tree.render({
              elem: '#ID_tree',
              method: 'get',
              type: 'all',
              url: MyCuckoo.resolve(MyCuckoo.api.host + action.path, {id: 1}),
              request: {isCheckbox: true, withRole: true},
              dataStyle: 'layuiStyle',
              response: { statusCode: 0, treeId: 'id', title: 'text', isLast: 'isLeaf', checkArr: 'checkbox'},
//              checkbar: true,
//              dot: false,
//              icon: ['-1', '1']
            });
          },
          yes: function(index, layero) {
            let param = tree.getNowParam('ID_tree');
            if(!param.nodeId || !param.nodeId.startsWith('id-leaf-')) {
              MyCuckoo.alert({msg: '请选择一个角色'});
              return;
            }

            let roleId = param.nodeId.replace('id-leaf-', '');
            $.request(operatorMap[obj.event], $.extend({}, data, {roleId: roleId})).then(function(json) {
              MyCuckoo.msg({msg: json.msg});
            });

            layer.close(index);
          }
        });
      },
      //分配权限
      assignRes: function(obj) {
        let data = obj.data;
        if (data.status == 'disable') {
          MyCuckoo.alert({ title : '提示', msg : '请先启用此用户！' });
          return;
        } else if(data.roleId == 0) {
          MyCuckoo.alert({ title : '提示', msg : '请先为此用户分配有效角色！' });
          return;
        }

        let url = MyCuckoo.resolve('userMgrAssignModOpt.html?action={action}&opt={opt}&id={id}&name={name}',
            {'action': obj.event, 'opt': queryObj.id, 'id': data.userId, 'name': data.name})
        MyCuckoo.dialog('分配权限', url);
      },
      more: function (obj) {
        let that = this;
        let btns = MyCuckoo.getActions(operator, 'more');
        dropdown.render({
          elem: obj.elem,
          show: true,
          data: btns,
          customName: {
            title: 'name'
          },
          click: function(menudata) {
            obj.event = menudata.code;
            that.on(obj);
          }
        });
      }
      //end
    }
  });
</script>
