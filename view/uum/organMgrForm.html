<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>机构信息</title>
  <link type="image/x-icon" href="../../static/images/favicon.ico" rel="shortcut icon" />
  <link type="text/css" href="../../static/layui/2.13.5/css/layui.css" rel="stylesheet" />
  <link type="text/css" href="../../static/css/mycuckoo.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/dtree.css" rel="stylesheet" />
  <link type="text/css" href="../../static/dtree/css/font/dtreefont.css" rel="stylesheet" />
</head>
<body>
  <div class="mycuckoo-main">
    <form class="layui-form layui-form-pane" name="editForm" lay-filter="editForm">
      <input type="hidden" name="orgId" />
      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label">简称</label>
          <div class="layui-input-inline">
            <input type="text" name="simpleName" class="layui-input" />
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">全称</label>
          <div class="layui-input-inline">
            <input type="text" name="fullName" class="layui-input" />
          </div>
        </div>
      </div>

      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label">编码</label>
          <div class="layui-input-inline">
            <input type="text" name="code" class="layui-input" autocomplete="off" lay-verify="alphanumeric" maxlength="10" />
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">所属地区</label>
          <div class="layui-input-inline">
            <select name="provinceCode" lay-filter="provinceCode" lay-verify="required" lay-search><option value="">请选择省</option></select>
            <input type="hidden" name="provinceName" />
          </div>
          <div class="layui-input-inline">
            <select name="cityCode" lay-filter="cityCode" lay-search disabled><option value="">请选择市</option></select>
            <input type="hidden" name="cityName" />
          </div>
          <div class="layui-input-inline">
            <select name="countyCode" lay-filter="countyCode" lay-search disabled><option value="">请选择县</option></select>
            <input type="hidden" name="countyName" />
          </div>
        </div>
      </div>

      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label">联系电话1</label>
          <div class="layui-input-inline">
            <input type="text" name="tel1" class="layui-input" lay-verify="phone" />
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">联系地址1</label>
          <div class="layui-input-inline">
            <input type="text" name="address1" class="layui-input" maxlength="100" />
          </div>
        </div>
      </div>

      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label">联系电话2</label>
          <div class="layui-input-inline">
            <input type="text" name="tel2" class="layui-input" lay-verify="phone" />
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">联系地址2</label>
          <div class="layui-input-inline">
            <input type="text" name="address2" class="layui-input" maxlength="100" />
          </div>
        </div>
      </div>

      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label">成立日期</label>
          <div class="layui-input-inline">
            <input type="text" name="beginDate" class="layui-input" placeholder="yyyy-MM-dd" lay-verify="date" readonly />
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">类型</label>
          <div class="layui-input-inline">
            <select name="type" lay-verify="required">
              <option value=""></option>
            </select>
          </div>
        </div>
      </div>

      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label">邮编</label>
          <div class="layui-input-inline">
            <input type="text" name="postal" class="layui-input" lay-verify="number" maxlength="6" />
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">法人代表</label>
          <div class="layui-input-inline">
            <input type="text" name="legal" class="layui-input" maxlength="10" />
          </div>
        </div>
      </div>

      <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label">税务号</label>
          <div class="layui-input-inline">
            <input type="text" name="taxNo" class="layui-input" lay-verify="alphanumeric" maxlength="25" />
          </div>
        </div>
        <div class="layui-inline">
          <label class="layui-form-label">注册登记号</label>
          <div class="layui-input-inline">
            <input type="text" name="regNo" class="layui-input" lay-verify="alphanumeric" maxlength="25" />
          </div>
        </div>
      </div>

     <!-- <div class="layui-form-item">
        <div class="layui-inline">
          <label class="layui-form-label">上级</label>
          <div class="layui-input-inline">
            <div class="layui-input-wrap">
              <input type="hidden" name="parentId" />
              <input type="text" name="parentName" class="layui-input" lay-affix="search"
                     data-event="selectOrgan" lay-filter="selectOrgan" lay-verify="required" readonly />
            </div>
          </div>
        </div>
      </div>-->

      <div class="layui-form-item layui-form-text">
        <label class="layui-form-label">备注</label>
        <div class="layui-input-block">
          <textarea name="memo" class="layui-textarea" placeholder="请输入内容" maxlength="50" ></textarea>
        </div>
      </div>

      <div class="toolbar"></div>
    </form>
  </div>
</body>
<script type="text/javascript" src="../../static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="../../static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript">
  layui.use(['jquery', 'form', 'laydate', 'dtree'], function() {
    const $ = layui.jquery,
      form = layui.form,
      layer = layui.layer,
      layDate = layui.laydate,
      tree = layui.dtree,
      queryObj = MyCuckoo.getQueryObject(location.search),
      resources = MyCuckoo.getResource(queryObj.reskey),
      resourceMap = MyCuckoo.getDictMap(resources),
      resourceObj = resourceMap[queryObj.action],
      $form = $('form[name=editForm]');

    function RegionCascade(options) {
      this.$form = options.$form;
      this.form = options.form;
      this.action = options.action;
      this.formFilter = options.formFilter;
      this.provinces = [];
      this.cities = {};
      this.counties = {};
      this.placeholder = {
        provinceCode: '请选择省',
        cityCode: '请选择市',
        countyCode: '请选择县'
      };
    }

    RegionCascade.prototype = {
      constructor: RegionCascade,
      bind: function() {
        const that = this,
          layuiForm = this.form;

        layuiForm.on('select(provinceCode)', function(data) {
          that.setName('provinceName', data.value, that.provinces);
          that.$form.find('input[name=cityName], input[name=countyName]').val('');
          layuiForm.val(that.formFilter, {cityCode: '', countyCode: ''});
          that.render('cityCode', that.cities[data.value] || [], !data.value);
          that.render('countyCode', [], true);
        });
        layuiForm.on('select(cityCode)', function(data) {
          let provinceCode = that.$form.find('select[name=provinceCode]').val();
          that.setName('cityName', data.value, that.cities[provinceCode] || []);
          that.$form.find('input[name=countyName]').val('');
          layuiForm.val(that.formFilter, {countyCode: ''});
          that.render('countyCode', that.counties[data.value] || [], !data.value);
        });
        layuiForm.on('select(countyCode)', function(data) {
          that.setName('countyName', data.value, that.counties[that.$form.find('select[name=cityCode]').val()] || []);
        });
      },
      load: function() {
        const that = this;
        if (!this.action || !this.action.canAccess()) return Promise.reject(new Error('无权访问地区资源'));

        return $.request(this.action, {id: 0}).then(function(json) {
          let nodes = (Array.isArray(json && json.data) ? json.data : []).map(function(node) {
            return that.normalize(node);
          }).filter(Boolean);

          that.provinces = nodes;
          that.cities = {};
          that.counties = {};
          nodes.forEach(function(province) {
            that.cities[province.code] = province.children || [];
            (province.children || []).forEach(function(city) {
              that.counties[city.code] = city.children || [];
            });
          });
          that.render('provinceCode', nodes, false);
          that.render('cityCode', [], true);
          that.render('countyCode', [], true);
        });
      },
      setValue: function(data) {
        data = data || {};

        let province = this.find(this.provinces, data.provinceCode, data.provinceName);
        if (!province) {
          this.clearAfter('provinceCode');
          return;
        }

        this.form.val(this.formFilter, {provinceCode: province.code});
        this.setName('provinceName', province.code, this.provinces);
        this.render('cityCode', this.cities[province.code], false);

        let city = this.find(this.cities[province.code], data.cityCode, data.cityName);
        if (!city) {
          this.clearAfter('cityCode');
          return;
        }

        this.form.val(this.formFilter, {cityCode: city.code});
        this.setName('cityName', city.code, this.cities[province.code]);
        this.render('countyCode', this.counties[city.code], false);

        let county = this.find(this.counties[city.code], data.countyCode, data.countyName);
        if (county) {
          this.form.val(this.formFilter, {countyCode: county.code});
          this.setName('countyName', county.code, this.counties[city.code]);
        } else {
          this.$form.find('input[name=countyName]').val('');
        }
      },
      setReadonly: function() {
        this.$form.find('select[name=provinceCode], select[name=cityCode], select[name=countyCode]').attr('disabled', 'disabled').removeAttr('lay-verify');
        this.form.render('select');
      },
      getValue: function() {
        let field = {};
        this.setName('provinceName', this.$form.find('select[name=provinceCode]').val(), this.provinces);
        this.setName('cityName', this.$form.find('select[name=cityCode]').val(), this.cities[this.$form.find('select[name=provinceCode]').val()] || []);
        this.setName('countyName', this.$form.find('select[name=countyCode]').val(), this.counties[this.$form.find('select[name=cityCode]').val()] || []);

        ['provinceCode', 'provinceName', 'cityCode', 'cityName', 'countyCode', 'countyName'].forEach(name => {
          field[name] = this.$form.find('[name=' + name + ']').val();
        });
        return field;
      },
      normalize: function(node) {
        if (!node) return null;
        let code = String(node.code != null ? node.code : (node.id != null ? node.id : ''));
        let name = String(node.name != null ? node.name : (node.text != null ? node.text : ''));
        return code ? {code: code, name: name, children: (node.children || []).map(this.normalize, this).filter(Boolean)} : null;
      },
      render: function(name, items, disabled) {
        let $select = this.$form.find('select[name=' + name + ']').empty().append('<option value="">' + this.placeholder[name] + '</option>');
        (items || []).forEach(item => $select.append($('<option>').val(item.code).text(item.name)));
        //下级没有数据时默认禁用且非必须
        let noData = !(items && items.length);
        $select.prop('disabled', !!disabled || noData);
        if (disabled || noData) {
          $select.removeAttr('lay-verify');
        } else {
          $select.attr('lay-verify', 'required');
        }
        this.form.render('select');
      },
      setName: function(name, code, items) {
        let item = this.find(items, code);
        this.$form.find('input[name=' + name + ']').val(item ? item.name : '');
      },
      find: function(items, code, name) {
        return (items || []).find(function(item) {
          return item.code === String(code) || (!!name && item.name === name);
        });
      },
      clearAfter: function(name) {
        if (name === 'provinceCode') {
          this.form.val(this.formFilter, {cityCode: '', countyCode: ''});
          this.$form.find('input[name=cityName], input[name=countyName]').val('');
          this.render('cityCode', [], true);
          this.render('countyCode', [], true);
        }
        if (name === 'cityCode') {
          this.form.val(this.formFilter, {countyCode: ''});
          this.$form.find('input[name=countyName]').val('');
          this.render('countyCode', [], true);
        }
      }
    }


    const FormMgr = function() {
      const that = this,
        regionCascade = new RegionCascade({
          $form: $form,
          form: form,
          action: resourceMap[MyCuckoo.res.districtMgr.tree],
          formFilter: 'editForm'
        });

      //渲染操作按钮
      $form.find('.toolbar').html(MyCuckoo.getActions(resourceObj || {}, 'form'));
      regionCascade.bind();

      //初始化
      Promise.all([MyCuckoo.api.getDict({typeCodes: 'org_type'}), regionCascade.load()]).then(function(results) {
        let json = results[0];
        let $select = $form.find('select[name=type]').empty();
        let dict = json.data['org_type'];
        for (let i = 0; i < dict.length; i++) {
          let item = dict[i];
          $select.append('<option value="' + item.code + '">' + item.name + '</option>');
        }
        form.render('select');

        //表单初始赋值
        if (queryObj.id && resourceObj.canAccess()) {
          $.request(resourceMap[MyCuckoo.res.organMgr.view], queryObj).then(json => {
            form.val('editForm', json.data);
            regionCascade.setValue(json.data || {});

            if (resourceObj.code === MyCuckoo.res.organMgr.view) {
              $form.find('input, select, textarea').attr('disabled', 'disabled');
              regionCascade.setReadonly();
            }
          });
        }
      }).catch(function(error) {
        MyCuckoo.msg({msg: error.message || '地区数据加载失败'});
      });

      //日期
      layDate.render({
        elem: 'input[name=beginDate]'
      });

      //操作按钮触发事件
      $form.find('a.layui-btn:not([lay-submit])').on('click', function() {
        let event = $(this).data('event');
        that.on({event: event, elem: this});
      });

      form.on('input-affix', function(data) {
        let elem = data.elem; // 获取输入框 DOM 对象
        let affix = data.affix; // 获取输入框 lay-affix 属性值
        let event = $(elem).data('event');
        $(elem).attr('disabled') != 'disabled' && that.on({event: event, elem: this});
      });

      //监听提交
      form.on('submit', function(data) {
        let event = $(this).data('event');
        Object.assign(data.field, regionCascade.getValue());
        that.on({event: event, data: data.field});

        return false;
      });
    }

    FormMgr.prototype = {
      constructor: FormMgr,
      on: function(obj) {
        let arr = obj.event.split(':');
        let event = arr[arr.length - 1];

        this[event] && this[event](obj);
      },
      openTree: function(url, config) {
        let fillForm = function(data) {
          let valObj =  {};
          for (let p in config) {
            if (typeof p == 'string') {
              valObj[config[p]] = data[p];
            }
          }
          form.val('editForm', valObj);
        }

        layer.open({
          type: 1,
          title: "请选择",
          area: ["400px", "80%"],
          content: '<ul id="ID_tree" class="dtree" data-id="0"></ul>',
          btn: ['确认选择'],
          success: function(layero, index){
            let treeObj = tree.render({
              elem: '#ID_tree',
              method: 'get',
              type: 'all',
              url: MyCuckoo.resolvePlaceholder(url, {id: 0, isCheckbox: true}),
              dataStyle: 'layuiStyle',
              response: { statusCode: 0, treeId: 'id', title: 'text'}
            });
            tree.on('nodedblclick(tree)', function(obj) {
              let data = obj.param;
              fillForm(data);
              layer.close(index);
            })
          },
          yes: function(index, layero) {
            let param = tree.getNowParam('ID_tree');
            if(!param.nodeId) {
              MyCuckoo.alert({msg: '请选择一个'});
              return;
            }

            fillForm(param);
            layer.close(index);
          }
        });
      },
      selectOrgan: function(obj) {
        let action = resourceMap[MyCuckoo.res.organMgr.tree];
        if (!action.canAccess()) {
          MyCuckoo.msg({msg: '无权访问此资源'});
          return;
        }

        this.openTree(MyCuckoo.api.getUrl(action), {nodeId: 'parentId', context: 'parentName'});
      },
      add: function(obj) {
        $.request(resourceObj, obj.data).then(json => {
          MyCuckoo.msg({msg: json.msg});

          this.refresh();
        });
      },
      modify: function(obj) {
        $.request(resourceObj, obj.data).then(json => {
          MyCuckoo.msg({msg: json.msg});

          this.refresh();
        });
      },
      //刷新父窗
      refresh: function() {
        setTimeout(function() {
          parent.location.reload();
        }, 1500);
      },
      //关闭当前iframe页
      close: function() {
        let index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
      }
    }

    new FormMgr();
    //end
  });
</script>
</html>
