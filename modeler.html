<html>
<head>

  <link type="text/css" href="static/layui/2.13.5/css/layui.css" rel="stylesheet" />

 <!-- <link rel="stylesheet" href="https://unpkg.com/bpmn-js@18.0.0/dist/assets/bpmn-font/css/bpmn.css" />-->

  <style type="text/css">

      height: 100%;
      margin: 0;
    }

    .mycuckoo-main > .layui-row:last-child {
      height: calc(100% - 38px);
    }

    .modeler-workspace {
      height: calc(100% - 38px);
    }

    .modeler-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 4px 0;
    }

    .modeler-pane, #ID_modeler_right {
      height: 100%;
    }

    .modeler-pane {
      position: relative;
    }

    .djs-container {
      background: url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGRlZnM+PHBhdHRlcm4gaWQ9ImEiIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTTAgMTBoNDBNMTAgMHY0ME0wIDIwaDQwTTIwIDB2NDBNMCAzMGg0ME0zMCAwdjQwIiBmaWxsPSJub25lIiBzdHJva2U9IiNlMGUwZTAiIG9wYWNpdHk9Ii4yIi8+PHBhdGggZD0iTTQwIDBIMHY0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZTBlMGUwIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI2EpIi8+PC9zdmc+");
    }

    /* bpmn 画布 logo */
    .bjs-powered-by {
      display: none;
    }

    /* app.css */
    .bpmn-icon-task.red {
      color: #cc0000 !important;
    }

    /* app.css */
    .icon-custom { /* 定义一个公共的类名 */
      border-radius: 50%;
      background-size: 65%;
      background-repeat: no-repeat;
      background-position: center;
    }

    .icon-custom.cuckoo-task { /* 加上背景图 */
      background-image: url('https://hexo-blog-1256114407.cos.ap-shenzhen-fsi.myqcloud.com/rules.png');
    }

</head>
<body>
<div class="mycuckoo-main">
  <div class="layui-row">
    <div class="layui-col-lg9">
      <div class="layui-btn-group modeler-toolbar">
        <a href="javascript: " class="layui-btn layui-btn-xs layui-btn-primary layui-border" data-event="create">
          <i class="layui-icon layui-icon-add-1"></i> 新建设计
        </a>
        <a href="javascript: " class="layui-btn layui-btn-xs layui-btn-primary layui-border" data-event="viewDemo">
          <i class="layui-icon layui-icon-file"></i> 预览 Demo
        </a>
        <a href="javascript: " class="layui-btn layui-btn-xs layui-btn-primary layui-border layui-hide" data-event="viewXml">
          <i class="layui-icon layui-icon-read"></i> 查看 XML
        </a>
        <a href="javascript: " class="layui-btn layui-btn-xs layui-btn-primary layui-border layui-hide" data-event="save">
          <i class="layui-icon layui-icon-ok"></i> 保存流程
        </a>
        <div class="layui-layout-right"></div>
          <a href="javascript: " class="layui-btn layui-btn-xs layui-btn-primary layui-border layui-hide" data-event="diagram">
            <i class="layui-icon layui-icon-export"></i> 下载 BPMN
          </a>
          <a href="javascript: " class="layui-btn layui-btn-xs layui-btn-primary layui-border layui-hide" data-event="svg">
            <i class="layui-icon layui-icon-download-circle"></i> 下载 SVG
          </a>
      </div>
    </div>
    <div class="layui-col-lg3"></div>
  </div>

  <div id="ID_modeler_edit_row" class="layui-row modeler-workspace">
    <div id="ID_modeler_editor" class="layui-col-lg9 layui-col-md8 layui-col-sm8 layui-panel modeler-pane"></div>
    <div id="ID_modeler_right" class="layui-col-lg3 layui-col-md4 layui-col-sm4"></div>
  </div>

  <div id="ID_modeler_preview_row" class="layui-row layui-hide modeler-workspace">
    <div id="ID_modeler_viewer" class="layui-col-lg12 modeler-pane"></div>
  </div>

</div>
<script type="text/javascript" src="static/layui/2.13.5/layui.js" charset="UTF-8"></script>
<script type="text/javascript" src="static/bpmn/18.0.0/bpmn-modeler.development.js" charset="UTF-8"></script>
<script type="text/javascript" src="static/mycuckoo.bundle.js" charset="UTF-8"></script>
<script type="text/javascript" src="static/bpmn/modeler-plugins.js" charset="UTF-8"></script>
  <script type="text/javascript">
    layui.config({
      base: 'static/extend/',
      version: '101100'
    });

    layui.use(['jquery', 'form'], function() {
      const $ = layui.jquery,
        layer = layui.layer,
        form = layui.form,
        queryObj = MyCuckoo.getQueryObject(location.search),
        resources = MyCuckoo.getResource(queryObj.reskey),
        resourceMap = MyCuckoo.getDictMap(resources),
        resourceObj = resourceMap[queryObj.action],
        $toolbar = $('.layui-btn-group');

      const userPicker = MyCuckoo.createUserPicker({
            width: 500,
            height: 400,
            layer: layer,
            url: './view/uum/userPicker.html'
          });

      const setEncoded = function($link, name, data, type) {
        if (data) {
          let encodedData = encodeURIComponent(data);
          $link.removeClass('layui-hide').attr({'href': 'data:' + type + ';charset=UTF-8,' + encodedData, 'download': name});
        } else {
          $link.addClass('layui-hide');
        }
      }

      const debounce = function(fn, timeout) {
        let timer;

        return function() {
          if (timer) {
            clearTimeout(timer);
          }

          timer = setTimeout(fn, timeout);
        };
      }

      const downloadFile = function($link) {
        let href = $link.attr('href');
        if (!href) {
          return false;
        }

        let elem = document.createElement('a');
        elem.href = href;
        elem.download = $link.attr('download') || '';
        document.body.appendChild(elem);
        elem.click();
        document.body.removeChild(elem);
        return true;
      }

      const escapeHtml = function(text) {
        return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
      }

      const getProcessInfo = function(xml) {
        try {
          let parser = new DOMParser();
          let doc = parser.parseFromString(xml, 'text/xml');
          let process = doc.getElementsByTagNameNS('*', 'process')[0];
          if (!process) {
            return {};
          }

          return {
            key: process.getAttribute('id') || '',
            name: process.getAttribute('name') || ''
          };
        } catch (err) {
          console.warn('解析流程信息失败', err);
          return {};
        }
      }

      const ModelerMgr = function() {
        const that = this;

        this.modeler = null;
        this.isPreviewMode = false;

        $toolbar.find('a.layui-btn:not([lay-submit])').on('click', function() {
          let event = $(this).data('event');
          that.on({event: event, elem: this});
        });

        if (queryObj?.key) {
          this.init(queryObj);
        } else {
          this.create();
        }
      }


      ModelerMgr.prototype = {
        constructor: ModelerMgr,
        on: function(obj) {
          let arr = obj.event.split(':');
          let event = arr[arr.length - 1];

          this[event] && this[event](obj);
        },
        createModeler: function(previewOnly) {
          let that = this;
          if (this.modeler && typeof this.modeler.destroy === 'function') {
            this.modeler.destroy();
          }

          if (previewOnly) {
            this.modeler = new BpmnJS.NavigatedViewer({
              container: '#ID_modeler_viewer',
              height: '100%'
            });
          } else {
            this.modeler = new BpmnJS({
              container: '#ID_modeler_editor',
              myPropertiesPanel: {
                parent: '#ID_modeler_right',
                userPicker: userPicker,
                listenerSelectMode: 'layui1'
              },
              height: '100%',
              additionalModules: [
                ...ModelerPlugins.modules
              ],
              moddleExtensions: ModelerPlugins.moddles
            });

            this.modeler.on('commandStack.changed', debounce(function() {
              that.doExportFiles();
            }, 500));
          }

          return this.modeler;
        },
        create: async function() {
          try {
            let app = this.createModeler(false);
            await app.createDiagram();
            this.setPreviewMode(false);
          } catch (err) {
            console.error(err);
            MyCuckoo.msg({msg: '新建设计失败：' + (err && err.message ? err.message : err), icon: 2, time: 1800});
          }
        },
        viewDemo: function() {
          $.request({url: './modeler-demo.bpmn', method: 'get'}).then(xml => {
            this.doOpenDiagram(xml, false);
          });
        },
        viewXml: async function() {
          let xml = await this.getCurrentXml();
          if (!xml) {
            MyCuckoo.msg({msg: '当前没有可显示的 XML', icon: 2, time: 1800});
            return;
          }

          if (!layer) {
            return;
          }

          layer.open({
            type: 1,
            title: 'XML 预览',
            area: ['680px', '320px'],
            maxmin: true,
            shadeClose: true,
            content: '<div style="padding: 12px; height: 100%; box-sizing: border-box;">'
              + '<textarea readonly class="layui-textarea" style="height: 540px; font-family: Consolas, monospace;">'
              + escapeHtml(xml)
              + '</textarea></div>'
          });
        },
        save: function() {
          this.doSave();
        },
        diagram: function(obj) {
          let $link = $(obj.elem);
          if (this.isPreviewMode) {
            MyCuckoo.msg({msg: '预览模式下不支持下载 BPMN', icon: 2, time: 1800});
            return;
          }

          if (!$link.attr('href')) {
            this.doExportFiles().then(() => {
              if (downloadFile($link)) {
                return;
              }

              MyCuckoo.msg({msg: '当前没有可下载的 BPMN 文件', icon: 2, time: 1800});
            });
            return;
          }

          downloadFile($link);
        },
        svg: function(obj) {
          let $link = $(obj.elem);
          if (this.isPreviewMode) {
            MyCuckoo.msg({msg: '预览模式下不支持下载 SVG', icon: 2, time: 1800});
            return;
          }

          if (!$link.attr('href')) {
            this.doExportFiles().then(() => {
              if (downloadFile($link)) {
                return;
              }

              MyCuckoo.msg({msg: '当前没有可下载的 SVG 文件', icon: 2, time: 1800});
            });
            return;
          }

          downloadFile($link);
        },


        doOpenDiagram: async function(xml, previewOnly) {
          try {
            let app = this.createModeler(!!previewOnly);
            await app.importXML(xml);
            this.setPreviewMode(!!previewOnly);
            return true;
          } catch (err) {
            console.error(err);
            MyCuckoo.msg({msg: 'XML 加载失败：' + (err && err.message ? err.message : err), icon: 2, time: 1800});
            throw err;
          }
        },
        doExportFiles: async function() {
          if (this.isPreviewMode || !this.modeler || typeof this.modeler.saveXML !== 'function') {
            return;
          }

          let $svg = $toolbar.find('a[data-event="svg"]');
          let $diagram = $toolbar.find('a[data-event="diagram"]');
          try {
            const { svg } = await this.modeler.saveSVG();
            setEncoded($svg, 'diagram.svg', svg, 'image/svg+xml');
          } catch (err) {
            console.error('Error happened saving SVG: ', err);
            setEncoded($svg, 'diagram.svg', null, 'image/svg+xml');
          }

          try {
            const { xml } = await this.modeler.saveXML({ format: true });
            this.toggleXmlButton(xml);
            let xml2 = xml.replace(/<!\[CDATA\[(.*?)\]\]>/gs, function(match, p1) {
              return '<![CDATA[' + p1.replace(/]]>/g, ']]]]><![CDATA[>') + ']]>';
            });

            setEncoded($diagram, 'diagram.bpmn', xml2, 'application/bpmn20-xml');
          } catch (err) {
            console.error('Error happened saving diagram: ', err);
            setEncoded($diagram, 'diagram.bpmn', null, 'application/bpmn20-xml');
          }
        },
        toggleXmlButton: function(xml) {
          $toolbar.find('a[data-event="showXml"]').toggleClass('layui-hide', !xml);
        },
        setPreviewMode: function(previewOnly) {
          let $diagramBtn = $toolbar.find('a[data-event="diagram"]');
          let $svgBtn = $toolbar.find('a[data-event="svg"]');
          this.isPreviewMode = previewOnly;

          this.toggleXmlButton(previewOnly);

          $('#ID_modeler_edit_row').toggleClass('layui-hide', previewOnly);
          $('#ID_modeler_preview_row').toggleClass('layui-hide', !previewOnly);
          $toolbar.children().toggleClass('layui-hide', previewOnly);

          if (previewOnly) {
            $diagramBtn.addClass('layui-hide').removeAttr('href download');
            $svgBtn.addClass('layui-hide').removeAttr('href download');
          } else {
            if ($diagramBtn.attr('href')) {
              $diagramBtn.removeClass('layui-hide');
            }
            if ($svgBtn.attr('href')) {
              $svgBtn.removeClass('layui-hide');
            }
          }
        },
        getCurrentXml: async function() {
          if (!this.modeler || this.isPreviewMode || typeof this.modeler.saveXML !== 'function') {
            throw new Error('当前不是可保存的编辑模式');
          }

          const { xml } = await this.modeler.saveXML({ format: true });
          return xml;
        },
        doSave: async function() {
          if (this.isPreviewMode) {
            MyCuckoo.msg({msg: '预览模式下不支持保存', icon: 2, time: 1800});
            return;
          }

          let that = this;
          let xml = await this.getCurrentXml();
          let processInfo = getProcessInfo(xml);
          let initData = {
            key: processInfo.key || '',
            name: processInfo.name || '',
            description: queryObj.description || ''
          };

          layer.open({
            type: 1,
            title: '保存流程定义',
            area: ['360px', '360px'],
            btn: ['保存', '取消'],
            shadeClose: true,
            content: '<div id="ID_modeler_save_form" style="padding: 16px 18px 0;">'
              + '<div class="layui-form layui-form-pane">'
              + '<div class="layui-form-item"><label class="layui-form-label">流程 Key</label><div class="layui-input-block"><input type="text" name="key" autocomplete="off" class="layui-input" placeholder="例如：leaveApply" value="' + escapeHtml(initData.key) + '" disabled></div></div>'
              + '<div class="layui-form-item"><label class="layui-form-label">流程名称</label><div class="layui-input-block"><input type="text" name="name" autocomplete="off" class="layui-input" placeholder="请输入流程名称" value="' + escapeHtml(initData.name) + '" disabled></div></div>'
              + '<div class="layui-form-item layui-form-text"><label class="layui-form-label">流程描述</label><div class="layui-input-block"><textarea name="description" class="layui-textarea" placeholder="可选">' + escapeHtml(initData.description) + '</textarea></div></div>'
              + '</div>'
              + '</div>',
            yes: async function(index) {
              let $form = $('#ID_modeler_save_form');
              let formData = {
                key: $.trim($form.find('[name="key"]').val()),
                name: $.trim($form.find('[name="name"]').val()),
                description: $.trim($form.find('[name="description"]').val())
              }
              if (!formData.key) {
                MyCuckoo.msg({msg: '请输入流程 Key', icon: 2, time: 1800});
                return;
              }
              if (!formData.name) {
                MyCuckoo.msg({msg: '请输入流程名称', icon: 2, time: 1800});
                return;
              }

              let loadingIndex = layer.load(1, {shade: 0.15});
              try {
                let json = await $.request(resourceObj, {
                  ...formData,
                  xml: xml
                });

                layer.close(index);
                MyCuckoo.msg({msg: (json && json.msg) || '流程定义保存成功', icon: 1, time: 1800});
              } catch (err) {
                console.error(err);
                MyCuckoo.msg({msg: '保存流程定义失败：' + (err && err.message ? err.message : err), icon: 2, time: 2200});
              } finally {
                layer.close(loadingIndex);
              }
            }
          });
        },
        init: async function(queryObj) {
          try {
            const json = await $.request(resourceMap[MyCuckoo.res.flowMgr.defView], queryObj).then(json => {
              return json;
            });

            let xml = json.data;
            if (!xml || String(xml).indexOf('<') === -1) {
              throw new Error('接口未返回有效 XML');
            }

            await this.doOpenDiagram(xml, (resourceObj.code === MyCuckoo.res.flowMgr.defView));
          } catch (err) {
            console.error(err);
            MyCuckoo.msg({msg: '获取接口 XML 失败：' + (err && err.message ? err.message : err), icon: 2, time: 1800});
          }
        }
      }

      new ModelerMgr();
      //end
    });
</script>
</body>
